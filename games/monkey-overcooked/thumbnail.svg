<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="55%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#fireGlow)"/>

  <!-- Kitchen tile pattern -->
  <g opacity="0.16" fill="#fde68a">
    <rect x="0" y="220" width="80" height="70"/>
    <rect x="160" y="220" width="80" height="70"/>
    <rect x="320" y="220" width="80" height="70"/>
    <rect x="480" y="220" width="80" height="70"/>
    <rect x="80" y="290" width="80" height="70"/>
    <rect x="240" y="290" width="80" height="70"/>
    <rect x="400" y="290" width="80" height="70"/>
    <rect x="560" y="290" width="80" height="70"/>
  </g>

  <!-- Order tickets at top -->
  <g transform="translate(26, 18)">
    <rect width="124" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <rect x="8" y="48" width="108" height="7" rx="3" fill="#22c55e"/>
    <text x="14" y="26" font-size="18" font-family="system-ui, sans-serif" font-weight="900" fill="#78350f">🍔 X-MACACO</text>
    <text x="14" y="42" font-size="13" font-family="system-ui, sans-serif" font-weight="700" fill="#92400e">🍞 + 🍖🔥 + 🥬</text>
  </g>
  <g transform="translate(164, 18)">
    <rect width="124" height="62" rx="10" fill="#fef3c7" stroke="#ef4444" stroke-width="3"/>
    <rect x="8" y="48" width="44" height="7" rx="3" fill="#ef4444"/>
    <text x="14" y="26" font-size="18" font-family="system-ui, sans-serif" font-weight="900" fill="#78350f">🥟 PASTEL</text>
    <text x="14" y="42" font-size="13" font-family="system-ui, sans-serif" font-weight="700" fill="#92400e">🫓 + 🥥🔪 🔥</text>
  </g>

  <!-- Big fire behind stove -->
  <g transform="translate(320, 185)">
    <path d="M-95,30 C-105,-35 -55,-75 -35,-115 C-15,-65 5,-90 20,-130 C45,-80 95,-55 85,30 Z" fill="#ef4444" opacity="0.9"/>
    <path d="M-65,30 C-70,-15 -35,-45 -18,-75 C0,-40 15,-60 28,-85 C48,-45 65,-25 55,30 Z" fill="#f97316"/>
    <path d="M-35,30 C-35,0 -15,-25 0,-45 C15,-20 35,0 32,30 Z" fill="#fde047"/>
  </g>

  <!-- Flying bananas -->
  <g transform="translate(275, 86) rotate(-25)">
    <path d="M-26,8 C-10,-14 14,-14 28,6 C12,-1 -8,-1 -26,8 Z" fill="#facc15" stroke="#854d0e" stroke-width="3"/>
    <path d="M-28,6 L-33,2" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(390, 62) rotate(22) scale(1.15)">
    <path d="M-26,8 C-10,-14 14,-14 28,6 C12,-1 -8,-1 -26,8 Z" fill="#facc15" stroke="#854d0e" stroke-width="3"/>
  </g>
  <g transform="translate(495, 108) rotate(-42) scale(0.9)">
    <path d="M-26,8 C-10,-14 14,-14 28,6 C12,-1 -8,-1 -26,8 Z" fill="#fde047" stroke="#854d0e" stroke-width="3"/>
  </g>

  <!-- Left Monkey Chef (Panicking with spatula) -->
  <g transform="translate(168, 200)">
    <!-- Ears -->
    <circle cx="-48" cy="-8" r="18" fill="#7c2d12" stroke="#431407" stroke-width="4"/>
    <circle cx="-48" cy="-8" r="10" fill="#fed7aa"/>
    <circle cx="48" cy="-8" r="18" fill="#7c2d12" stroke="#431407" stroke-width="4"/>
    <circle cx="48" cy="-8" r="10" fill="#fed7aa"/>
    <!-- Body/apron -->
    <rect x="-42" y="28" width="84" height="62" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
    <rect x="-24" y="34" width="48" height="40" rx="8" fill="#facc15"/>
    <!-- Head -->
    <circle cx="0" cy="-6" r="44" fill="#9a3412" stroke="#431407" stroke-width="4"/>
    <ellipse cx="0" cy="10" rx="34" ry="24" fill="#fed7aa"/>
    <ellipse cx="-16" cy="-12" rx="14" ry="15" fill="#fed7aa"/>
    <ellipse cx="16" cy="-12" rx="14" ry="15" fill="#fed7aa"/>
    <!-- Googly panicked eyes -->
    <circle cx="-15" cy="-13" r="11" fill="#fff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="15" cy="-13" r="11" fill="#fff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="-12" cy="-15" r="4" fill="#0f172a"/>
    <circle cx="18" cy="-11" r="4" fill="#0f172a"/>
    <!-- Screaming mouth -->
    <ellipse cx="0" cy="14" rx="13" ry="11" fill="#7f1d1d" stroke="#450a0a" stroke-width="3"/>
    <ellipse cx="0" cy="19" rx="8" ry="5" fill="#fb7185"/>
    <!-- Chef Hat -->
    <path d="M-32,-40 C-42,-68 -16,-78 -8,-68 C0,-84 22,-78 24,-64 C38,-68 42,-45 30,-40 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/>
    <rect x="-32" y="-44" width="64" height="14" rx="4" fill="#facc15" stroke="#1e293b" stroke-width="3"/>
    <!-- Spatula in hand -->
    <g transform="translate(52, 22) rotate(25)">
      <rect x="-4" y="-34" width="8" height="44" rx="3" fill="#94a3b8" stroke="#1e293b" stroke-width="3"/>
      <rect x="-14" y="-54" width="28" height="22" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
    </g>
  </g>

  <!-- Right Monkey Chef (Extinguisher!) -->
  <g transform="translate(474, 206)">
    <circle cx="-46" cy="-8" r="17" fill="#7c2d12" stroke="#431407" stroke-width="4"/>
    <circle cx="-46" cy="-8" r="9" fill="#fed7aa"/>
    <circle cx="46" cy="-8" r="17" fill="#7c2d12" stroke="#431407" stroke-width="4"/>
    <circle cx="46" cy="-8" r="9" fill="#fed7aa"/>
    <rect x="-40" y="28" width="80" height="60" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
    <rect x="-22" y="34" width="44" height="38" rx="8" fill="#4ade80"/>
    <circle cx="0" cy="-6" r="42" fill="#9a3412" stroke="#431407" stroke-width="4"/>
    <ellipse cx="0" cy="10" rx="32" ry="22" fill="#fed7aa"/>
    <ellipse cx="-15" cy="-12" rx="13" ry="14" fill="#fed7aa"/>
    <ellipse cx="15" cy="-12" rx="13" ry="14" fill="#fed7aa"/>
    <circle cx="-14" cy="-12" r="10" fill="#fff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="14" cy="-12" r="10" fill="#fff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="-17" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="11" cy="-12" r="4" fill="#0f172a"/>
    <path d="M-12,11 Q0,22 12,11" fill="none" stroke="#450a0a" stroke-width="4" stroke-linecap="round"/>
    <!-- Chef Hat -->
    <path d="M-30,-38 C-40,-64 -14,-74 -6,-65 C2,-80 22,-74 24,-60 C36,-64 40,-42 28,-38 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/>
    <rect x="-30" y="-42" width="60" height="13" rx="4" fill="#4ade80" stroke="#1e293b" stroke-width="3"/>
    <!-- Red Extinguisher -->
    <g transform="translate(-56, 22) rotate(-18)">
      <rect x="-13" y="-22" width="26" height="44" rx="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
      <rect x="-6" y="-30" width="12" height="10" rx="2" fill="#334155"/>
      <path d="M-6,-26 L-28,-32" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-38" cy="-35" r="9" fill="#e0f2fe" opacity="0.9"/>
      <circle cx="-50" cy="-42" r="12" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>

  <!-- Central Counter & Burning Grill -->
  <rect x="40" y="256" width="560" height="90" rx="14" fill="url(#counter)" stroke="#78350f" stroke-width="5"/>
  <rect x="40" y="256" width="560" height="22" rx="10" fill="#fde68a" opacity="0.5"/>
  <!-- Grill pan -->
  <rect x="260" y="226" width="120" height="44" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  <circle cx="320" cy="244" r="22" fill="#451a03" stroke="#000" stroke-width="3"/>
  <path d="M306,238 Q320,224 334,238" fill="none" stroke="#ef4444" stroke-width="4"/>

  <!-- Speech bubble -->
  <g transform="translate(362, 118)">
    <rect x="0" y="0" width="152" height="34" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/>
    <text x="12" y="22" font-size="14" font-family="system-ui, sans-serif" font-weight="900" fill="#dc2626">🔥 TÁ QUEIMANDO!</text>
  </g>

  <!-- Title Banner -->
  <g transform="translate(320, 315)">
    <rect x="-240" y="-26" width="480" height="44" rx="22" fill="#111827" stroke="#facc15" stroke-width="4"/>
    <text x="0" y="3" text-anchor="middle" font-size="23" font-family="system-ui, sans-serif" font-weight="900" fill="#fde047" letter-spacing="0.5">🍳 MACACO NA CHAPA: COZINHA DO CAOS</text>
  </g>
</svg>
