<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="boardWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="mangoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="acaiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="55%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="cashewGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="jackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Jungle Background -->
  <rect width="640" height="360" fill="url(#sky)" />
  <rect width="640" height="360" fill="url(#sunGlow)" />

  <!-- Decorative Palm Leaves -->
  <g fill="#052e16" opacity="0.65">
    <path d="M0 0 Q110 20 140 95 Q75 65 0 85 Z" />
    <path d="M0 40 Q85 85 110 175 Q45 125 0 130 Z" />
    <path d="M640 0 Q530 20 500 95 Q565 65 640 85 Z" />
    <path d="M640 280 Q540 230 495 360 L640 360 Z" />
  </g>

  <!-- Mini 3x3 Match-3 Board -->
  <g transform="translate(278, 44)" filter="url(#shadow)">
    <rect x="-12" y="-12" width="276" height="276" rx="22" fill="url(#boardWood)" stroke="#f59e0b" stroke-width="4" />
    <rect x="0" y="0" width="252" height="252" rx="14" fill="#1e293b" fill-opacity="0.72" />
    <!-- Grid Tiles -->
    <g fill="#0f172a" fill-opacity="0.55" stroke="#334155" stroke-width="1.5">
      <rect x="8" y="8" width="74" height="74" rx="12" />
      <rect x="89" y="8" width="74" height="74" rx="12" />
      <rect x="170" y="8" width="74" height="74" rx="12" />
      <rect x="8" y="89" width="74" height="74" rx="12" />
      <rect x="89" y="89" width="74" height="74" rx="12" fill="#7e22ce" fill-opacity="0.45" stroke="#c084fc" stroke-width="2" />
      <rect x="170" y="89" width="74" height="74" rx="12" />
      <rect x="8" y="170" width="74" height="74" rx="12" />
      <rect x="89" y="170" width="74" height="74" rx="12" />
      <rect x="170" y="170" width="74" height="74" rx="12" />
    </g>

    <!-- Row 1: Mango, Rainbow Banana, Acai -->
    <g transform="translate(45, 45)">
      <ellipse cx="0" cy="2" rx="24" ry="26" fill="url(#mangoGrad)" stroke="#7c2d12" stroke-width="3" />
      <path d="M2 -22 Q18 -34 22 -20 Q10 -14 2 -22 Z" fill="#22c55e" stroke="#14532d" stroke-width="2" />
      <circle cx="-8" cy="-2" r="5" fill="#fff" />
      <circle cx="8" cy="-2" r="5" fill="#fff" />
      <circle cx="-7" cy="-2" r="2.5" fill="#0f172a" />
      <circle cx="9" cy="-2" r="2.5" fill="#0f172a" />
      <path d="M-7 10 Q0 16 7 10" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <g transform="translate(126, 45)">
      <circle cx="0" cy="0" r="28" fill="url(#rainbowGrad)" stroke="#fef08a" stroke-width="3.5" />
      <path d="M-12 8 Q0 -18 14 -12 Q6 4 -2 12 Z" fill="#fef08a" stroke="#78350f" stroke-width="2" />
      <rect x="-15" y="-9" width="13" height="8" rx="2" fill="#0f172a" />
      <rect x="2" y="-9" width="13" height="8" rx="2" fill="#0f172a" />
      <line x1="-2" y1="-5" x2="2" y2="-5" stroke="#0f172a" stroke-width="2.5" />
    </g>

    <g transform="translate(207, 45)">
      <circle cx="0" cy="2" r="24" fill="url(#acaiGrad)" stroke="#3b0764" stroke-width="3" />
      <ellipse cx="-8" cy="-10" rx="6" ry="3.5" transform="rotate(-30 -8 -10)" fill="#f3e8ff" fill-opacity="0.65" />
      <circle cx="-8" cy="-1" r="5" fill="#fff" />
      <circle cx="8" cy="-1" r="5" fill="#fff" />
      <circle cx="-7" cy="-1" r="2.4" fill="#0f172a" />
      <circle cx="7" cy="-1" r="2.4" fill="#0f172a" />
      <path d="M-6 10 Q0 15 6 10" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Row 2: 3 Matching Bananas glowing! -->
    <g stroke="#fde047" stroke-width="4" fill="none" opacity="0.75">
      <line x1="25" y1="126" x2="225" y2="126" stroke-dasharray="8 6" />
    </g>
    <g transform="translate(45, 126)">
      <path d="M-20 14 Q-16 -22 18 -20 Q22 -14 14 -4 Q4 12 -14 22 Q-22 22 -20 14 Z" fill="url(#bananaGrad)" stroke="#78350f" stroke-width="3" />
      <circle cx="-2" cy="-2" r="4.5" fill="#fff" />
      <circle cx="9" cy="-5" r="4.5" fill="#fff" />
      <circle cx="-1" cy="-2" r="2.2" fill="#0f172a" />
      <circle cx="10" cy="-5" r="2.2" fill="#0f172a" />
      <path d="M-2 7 Q4 12 9 6" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" />
    </g>
    <g transform="translate(126, 126)">
      <path d="M-20 14 Q-16 -22 18 -20 Q22 -14 14 -4 Q4 12 -14 22 Q-22 22 -20 14 Z" fill="url(#bananaGrad)" stroke="#fef08a" stroke-width="3.5" />
      <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#ef4444" stroke-width="4" />
      <circle cx="-2" cy="-1" r="4.5" fill="#fff" />
      <circle cx="9" cy="-4" r="4.5" fill="#fff" />
      <circle cx="-1" cy="-1" r="2.2" fill="#0f172a" />
      <circle cx="10" cy="-4" r="2.2" fill="#0f172a" />
    </g>
    <g transform="translate(207, 126)">
      <path d="M-20 14 Q-16 -22 18 -20 Q22 -14 14 -4 Q4 12 -14 22 Q-22 22 -20 14 Z" fill="url(#bananaGrad)" stroke="#78350f" stroke-width="3" />
      <circle cx="-2" cy="-2" r="4.5" fill="#fff" />
      <circle cx="9" cy="-5" r="4.5" fill="#fff" />
      <circle cx="-1" cy="-2" r="2.2" fill="#0f172a" />
      <circle cx="10" cy="-5" r="2.2" fill="#0f172a" />
      <path d="M-2 7 Q4 12 9 6" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Row 3: Cashew, Coconut Bomb, Jackfruit -->
    <g transform="translate(45, 207)">
      <path d="M-16 8 C-18 -12 -6 -20 0 -20 C6 -20 18 -12 16 8 C15 22 -15 22 -16 8 Z" fill="url(#cashewGrad)" stroke="#7f1d1d" stroke-width="3" />
      <path d="M-4 -20 Q2 -32 10 -24 Q8 -18 2 -19 Z" fill="#a16207" stroke="#451a03" stroke-width="2" />
      <circle cx="-6" cy="-2" r="4.5" fill="#fff" />
      <circle cx="7" cy="-2" r="4.5" fill="#fff" />
      <circle cx="-5" cy="-2" r="2.2" fill="#0f172a" />
      <circle cx="8" cy="-2" r="2.2" fill="#0f172a" />
      <path d="M-5 9 Q0 14 5 9" fill="none" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <g transform="translate(126, 207)">
      <circle cx="0" cy="4" r="24" fill="#5c3a21" stroke="#f97316" stroke-width="3" />
      <path d="M0 -20 Q12 -32 18 -24" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
      <circle cx="19" cy="-25" r="6" fill="#fde047" />
      <circle cx="19" cy="-25" r="3" fill="#ef4444" />
      <circle cx="-8" cy="2" r="5" fill="#fff" />
      <circle cx="8" cy="2" r="5" fill="#fff" />
      <circle cx="-7" cy="2" r="2.5" fill="#0f172a" />
      <circle cx="7" cy="2" r="2.5" fill="#0f172a" />
      <path d="M-8 13 Q0 19 8 13" fill="#991b1b" stroke="#0f172a" stroke-width="2" />
    </g>

    <g transform="translate(207, 207)">
      <ellipse cx="0" cy="2" rx="23" ry="26" fill="url(#jackGrad)" stroke="#14532d" stroke-width="3" />
      <circle cx="-8" cy="-1" r="5" fill="#fff" />
      <circle cx="8" cy="-1" r="5" fill="#fff" />
      <circle cx="-7" cy="-1" r="2.4" fill="#0f172a" />
      <circle cx="9" cy="-1" r="2.4" fill="#0f172a" />
      <path d="M-7 10 Q0 15 7 10" fill="none" stroke="#14532d" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Expressive Monkey Mascot (Zé Banana) on Left -->
  <g transform="translate(132, 235)" filter="url(#shadow)">
    <!-- Tail -->
    <path d="M-42 35 Q-88 15 -78 -25 Q-72 -45 -56 -35" fill="none" stroke="#78350f" stroke-width="11" stroke-linecap="round" />
    <!-- Body -->
    <ellipse cx="0" cy="36" rx="44" ry="42" fill="#92400e" stroke="#451a03" stroke-width="4" />
    <ellipse cx="0" cy="40" rx="26" ry="28" fill="#fde68a" />
    <!-- Ears -->
    <circle cx="-48" cy="-26" r="18" fill="#92400e" stroke="#451a03" stroke-width="3.5" />
    <circle cx="-48" cy="-26" r="10" fill="#fca5a5" />
    <circle cx="48" cy="-26" r="18" fill="#92400e" stroke="#451a03" stroke-width="3.5" />
    <circle cx="48" cy="-26" r="10" fill="#fca5a5" />
    <!-- Head -->
    <circle cx="0" cy="-24" r="44" fill="#92400e" stroke="#451a03" stroke-width="4" />
    <ellipse cx="0" cy="-12" rx="34" ry="26" fill="#fde68a" />
    <circle cx="-14" cy="-32" r="14" fill="#fde68a" />
    <circle cx="14" cy="-32" r="14" fill="#fde68a" />
    <!-- Googly Excited Eyes -->
    <circle cx="-14" cy="-32" r="11" fill="#fff" stroke="#1e293b" stroke-width="2.5" />
    <circle cx="14" cy="-32" r="11" fill="#fff" stroke="#1e293b" stroke-width="2.5" />
    <circle cx="-11" cy="-30" r="5" fill="#0f172a" />
    <circle cx="17" cy="-34" r="5" fill="#0f172a" />
    <circle cx="-13" cy="-32" r="1.8" fill="#fff" />
    <circle cx="15" cy="-36" r="1.8" fill="#fff" />
    <!-- Big Grin -->
    <path d="M-18 -8 Q0 14 18 -8 Z" fill="#991b1b" stroke="#451a03" stroke-width="2.5" />
    <rect x="-8" y="-8" width="16" height="5" rx="2" fill="#fff" />
  </g>

  <!-- Speech Bubble -->
  <g transform="translate(18, 108)" filter="url(#shadow)">
    <rect x="0" y="0" width="218" height="44" rx="16" fill="#fef08a" stroke="#78350f" stroke-width="3" />
    <polygon points="98,43 114,43 110,58" fill="#fef08a" stroke="#78350f" stroke-width="3" />
    <rect x="94" y="38" width="24" height="7" fill="#fef08a" />
    <text x="109" y="27" text-anchor="middle" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="14" font-weight="900">TÁ PEGANDO FOGO, BICHO!</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(18, 18)" filter="url(#shadow)">
    <rect x="0" y="0" width="234" height="74" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#facc15" stroke-width="3.5" />
    <text x="16" y="33" fill="#facc15" font-family="system-ui, sans-serif" font-size="24" font-weight="900">🍌 BANANA CRUSH</text>
    <text x="16" y="57" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="800">24 FASES • VERSUS &amp; CO-OP P2P</text>
  </g>
</svg>
