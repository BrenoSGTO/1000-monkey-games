<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="35%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <radialGradient id="fur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="65%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="bananaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Tropical Sky -->
  <rect width="640" height="360" fill="url(#sky)" />

  <!-- Sun -->
  <circle cx="535" cy="75" r="46" fill="#fef08a" opacity="0.4" />
  <circle cx="535" cy="75" r="30" fill="#fde047" />

  <!-- Distant Hills -->
  <path d="M0 280 Q110 205 230 265 T470 250 T640 275 L640 360 L0 360 Z" fill="#0d9488" opacity="0.45" />
  <path d="M0 300 Q150 230 310 285 T640 280 L640 360 L0 360 Z" fill="#047857" opacity="0.65" />

  <!-- Bamboo Obstacle Left-Back -->
  <g filter="url(#shadow)">
    <rect x="430" y="0" width="56" height="122" rx="8" fill="url(#bamboo)" stroke="#052e16" stroke-width="3" />
    <rect x="424" y="106" width="68" height="18" rx="6" fill="#22c55e" stroke="#052e16" stroke-width="3" />
    <line x1="430" y1="54" x2="486" y2="54" stroke="#14532d" stroke-width="4" />
    <rect x="430" y="232" width="56" height="128" rx="8" fill="url(#bamboo)" stroke="#052e16" stroke-width="3" />
    <rect x="424" y="226" width="68" height="18" rx="6" fill="#22c55e" stroke="#052e16" stroke-width="3" />
    <line x1="430" y1="286" x2="486" y2="286" stroke="#14532d" stroke-width="4" />
    <!-- Vines -->
    <path d="M442 124 Q436 150 448 168" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="448" cy="170" rx="8" ry="4" transform="rotate(25 448 170)" fill="#4ade80" stroke="#052e16" stroke-width="2" />
  </g>

  <!-- Coconut Helicopter -->
  <g transform="translate(548, 178) rotate(-8)" filter="url(#shadow)">
    <ellipse cx="0" cy="-26" rx="34" ry="4.5" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" />
    <rect x="-3" y="-26" width="6" height="10" fill="#475569" />
    <circle cx="0" cy="0" r="20" fill="#78350f" stroke="#271203" stroke-width="3" />
    <circle cx="-7" cy="-3" r="5" fill="#fff" />
    <circle cx="-8" cy="-3" r="2.5" fill="#0f172a" />
    <path d="M-13 -10 L-2 -6" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <path d="M16 -2 L28 -8 L28 6 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Banana Coins -->
  <g transform="translate(362, 165)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="#facc15" stroke="#854d0e" stroke-width="3" />
    <path d="M-6 5 Q2 10 8 -5 Q3 2 -6 5 Z" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5" />
  </g>
  <g transform="translate(402, 182)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#854d0e" stroke-width="3" />
    <path d="M-5 4 Q2 8 7 -4 Q2 2 -5 4 Z" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5" />
  </g>

  <!-- Ground -->
  <rect x="0" y="316" width="640" height="44" fill="#713f12" />
  <rect x="0" y="310" width="640" height="14" fill="#22c55e" stroke="#052e16" stroke-width="3" />

  <!-- Motion Trail -->
  <path d="M72 215 Q148 250 220 185" fill="none" stroke="#fef08a" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.85" />

  <!-- Hero Monkey with Banana Propeller -->
  <g transform="translate(245, 176) rotate(-14)" filter="url(#shadow)">
    <!-- Tail -->
    <path d="M-32 10 Q-58 26 -62 -4 Q-64 -20 -50 -16" fill="none" stroke="#78350f" stroke-width="8" stroke-linecap="round" />
    <!-- Propeller Mast + Spinning Bananas -->
    <rect x="-4" y="-52" width="8" height="18" rx="3" fill="#475569" stroke="#0f172a" stroke-width="2" />
    <ellipse cx="0" cy="-52" rx="44" ry="8" fill="#fef08a" opacity="0.45" />
    <path d="M-42 -52 Q-20 -64 0 -52 Q-18 -46 -42 -52 Z" fill="url(#bananaGrad)" stroke="#713f12" stroke-width="2.5" />
    <path d="M42 -52 Q20 -64 0 -52 Q18 -46 42 -52 Z" fill="url(#bananaGrad)" stroke="#713f12" stroke-width="2.5" />
    <circle cx="0" cy="-52" r="5" fill="#ef4444" stroke="#0f172a" stroke-width="2" />

    <!-- Ears -->
    <circle cx="-35" cy="-4" r="14" fill="#78350f" stroke="#2c1810" stroke-width="3" />
    <circle cx="-35" cy="-4" r="7" fill="#fda4af" />
    <circle cx="35" cy="-4" r="14" fill="#78350f" stroke="#2c1810" stroke-width="3" />
    <circle cx="35" cy="-4" r="7" fill="#fda4af" />

    <!-- Body/Head -->
    <ellipse cx="0" cy="4" rx="36" ry="34" fill="url(#fur)" stroke="#2c1810" stroke-width="3.5" />
    <!-- Belly / Face Mask -->
    <ellipse cx="4" cy="12" rx="26" ry="20" fill="#fde68a" />
    <circle cx="-11" cy="-9" r="11" fill="#fde68a" />
    <circle cx="13" cy="-9" r="11" fill="#fde68a" />

    <!-- Expressive Wide Eyes -->
    <circle cx="-10" cy="-10" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="14" cy="-10" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="-7" cy="-9" r="4.5" fill="#0f172a" />
    <circle cx="17" cy="-11" r="4.5" fill="#0f172a" />
    <circle cx="-6" cy="-11" r="1.6" fill="#ffffff" />
    <circle cx="18" cy="-13" r="1.6" fill="#ffffff" />

    <!-- Grin -->
    <path d="M-8 10 Q4 26 20 10 Z" fill="#991b1b" stroke="#0f172a" stroke-width="2.5" />
    <rect x="-1" y="11" width="12" height="5" rx="1.5" fill="#ffffff" />

    <!-- Flapping Arm -->
    <ellipse cx="-14" cy="22" rx="16" ry="8" transform="rotate(24 -14 22)" fill="#92400e" stroke="#2c1810" stroke-width="3" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(22, 22)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="68" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#facc15" stroke-width="3.5" />
    <text x="16" y="33" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900">🍌 FLAPPY MICO</text>
    <text x="18" y="54" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">VOO DA VERGONHA • P2P &amp; 2P</text>
  </g>
</svg>
