<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d26" />
      <stop offset="55%" stop-color="#140c34" />
      <stop offset="100%" stop-color="#052126" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="neonTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="furCube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="maskCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Neon Grid -->
  <rect width="640" height="360" fill="url(#bg)" />
  <g stroke="#22d3ee" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="80" y1="0" x2="80" y2="280" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="240" y1="0" x2="240" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="480" y1="0" x2="480" y2="280" />
    <line x1="560" y1="0" x2="560" y2="280" />
  </g>

  <!-- Neon Banana Moon & Palm Silhouettes -->
  <circle cx="520" cy="82" r="44" fill="#facc15" fill-opacity="0.16" />
  <path d="M510 46 A36 36 0 1 0 554 96 A28 28 0 1 1 510 46 Z" fill="#fde047" filter="url(#glow)" />
  <g fill="#064e3b" opacity="0.55">
    <rect x="65" y="160" width="12" height="120" />
    <path d="M71 162 Q35 135 15 162 Q48 156 71 162 Z" />
    <path d="M71 162 Q105 130 128 158 Q96 155 71 162 Z" />
    <path d="M71 162 Q75 118 108 118 Q84 140 71 162 Z" />
  </g>

  <!-- Equalizer Beat Bars -->
  <g fill="#a855f7" opacity="0.35">
    <rect x="130" y="220" width="18" height="60" rx="3" />
    <rect x="156" y="190" width="18" height="90" rx="3" />
    <rect x="182" y="235" width="18" height="45" rx="3" />
    <rect x="208" y="170" width="18" height="110" rx="3" />
    <rect x="234" y="210" width="18" height="70" rx="3" />
    <rect x="410" y="205" width="18" height="75" rx="3" />
    <rect x="436" y="165" width="18" height="115" rx="3" />
    <rect x="462" y="225" width="18" height="55" rx="3" />
  </g>

  <!-- Neon Floor -->
  <rect x="0" y="280" width="640" height="80" fill="url(#floor)" />
  <line x1="0" y1="280" x2="640" y2="280" stroke="#22d3ee" stroke-width="4" filter="url(#glow)" />
  <g stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2">
    <line x1="40" y1="280" x2="10" y2="360" />
    <line x1="120" y1="280" x2="90" y2="360" />
    <line x1="200" y1="280" x2="170" y2="360" />
    <line x1="280" y1="280" x2="250" y2="360" />
    <line x1="360" y1="280" x2="330" y2="360" />
    <line x1="440" y1="280" x2="410" y2="360" />
    <line x1="520" y1="280" x2="490" y2="360" />
    <line x1="600" y1="280" x2="570" y2="360" />
  </g>

  <!-- Coconut Spikes -->
  <g filter="url(#glow)">
    <polygon points="270,280 294,225 318,280" fill="#1e1b4b" stroke="#fb7185" stroke-width="3" />
    <polygon points="320,280 344,225 368,280" fill="#1e1b4b" stroke="#fb7185" stroke-width="3" />
    <polygon points="370,280 394,225 418,280" fill="#1e1b4b" stroke="#fb7185" stroke-width="3" />
  </g>

  <!-- Jump Orb -->
  <circle cx="495" cy="172" r="20" fill="#facc15" fill-opacity="0.25" stroke="#fde047" stroke-width="4" filter="url(#glow)" />
  <circle cx="495" cy="172" r="9" fill="#fef08a" />

  <!-- Neon Arc Trail -->
  <path d="M55 245 Q175 105 305 142" fill="none" stroke="url(#neonTrail)" stroke-width="14" stroke-linecap="round" />

  <!-- Rival P2 Cyber Monkey (Background Multiplayer Racer) -->
  <g transform="translate(175, 190) rotate(12) scale(0.68)" opacity="0.9">
    <path d="M-34 10 C-56 12 -58 -16 -44 -24" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" />
    <circle cx="-39" cy="-6" r="14" fill="#1e293b" stroke="#f472b6" stroke-width="3.5" />
    <circle cx="-39" cy="-5" r="7.5" fill="#f472b6" />
    <circle cx="39" cy="-6" r="14" fill="#1e293b" stroke="#f472b6" stroke-width="3.5" />
    <circle cx="39" cy="-5" r="7.5" fill="#f472b6" />
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="4" />
    <path d="M0 -8 C-14 -24 -28 -12 -24 2 C-30 16 -16 28 0 26 C16 28 30 16 24 2 C28 -12 14 -24 0 -8 Z" fill="#1e293b" />
    <rect x="-26" y="-17" width="52" height="14" rx="7" fill="#020617" stroke="#f472b6" stroke-width="2.5" />
    <rect x="-20" y="-13" width="40" height="6" rx="3" fill="#f472b6" />
    <circle cx="9" cy="-10" r="3" fill="#ffffff" />
    <path d="M-12 9 Q0 22 12 9 Z" fill="#991b1b" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Hero Neon Geometric Monkey Cube Jumping -->
  <g transform="translate(310, 142) rotate(-14)" filter="url(#glow)">
    <!-- Curved Neon-Tipped Tail -->
    <path d="M-34 12 C-58 14 -64 -18 -46 -28" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round" />
    <path d="M-34 12 C-58 14 -64 -18 -46 -28" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />

    <!-- Ears with Rosy Inner Shell -->
    <circle cx="-40" cy="-6" r="14.5" fill="url(#furCube)" stroke="#22d3ee" stroke-width="3.5" />
    <circle cx="-40" cy="-5" r="7.5" fill="#fda4af" />
    <circle cx="40" cy="-6" r="14.5" fill="url(#furCube)" stroke="#22d3ee" stroke-width="3.5" />
    <circle cx="40" cy="-5" r="7.5" fill="#fda4af" />

    <!-- Cube Body with Fur Gradient & Neon Rim -->
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="url(#furCube)" stroke="#22d3ee" stroke-width="4" />

    <!-- Sporty Cyan Headband -->
    <rect x="-31" y="-29" width="62" height="9" rx="4" fill="#22d3ee" stroke="#0f172a" stroke-width="2" />

    <!-- Crown -->
    <path d="M-21 -34 L-24 -56 L-10 -44 L0 -62 L10 -44 L24 -56 L21 -34 Z" fill="url(#crownGold)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="0" cy="-43" r="4" fill="#fb7185" />

    <!-- Peanut / Heart Facial Mask -->
    <path d="M0 -8 C-15 -26 -30 -14 -25 2 C-31 18 -16 30 0 28 C16 30 31 18 25 2 C30 -14 15 -26 0 -8 Z" fill="url(#maskCream)" />

    <!-- Expressive Eyebrows -->
    <path d="M-21 -21 Q-13 -25 -6 -19" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <path d="M6 -19 Q13 -25 21 -21" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />

    <!-- Vesgo Eyes with Crisp Specular Highlights -->
    <circle cx="-13" cy="-10" r="9.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <circle cx="13" cy="-10" r="9.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <circle cx="-9.5" cy="-9" r="4.4" fill="#0f172a" />
    <circle cx="9.5" cy="-11.5" r="4.4" fill="#0f172a" />
    <circle cx="-11" cy="-11" r="1.8" fill="#ffffff" />
    <circle cx="8" cy="-13.2" r="1.8" fill="#ffffff" />

    <!-- Nostrils -->
    <circle cx="-4" cy="2" r="1.8" fill="#92400e" />
    <circle cx="4" cy="2" r="1.8" fill="#92400e" />

    <!-- Hyped Open Grin + Tooth + Tongue -->
    <path d="M-14 8 Q0 26 14 8 Z" fill="#991b1b" stroke="#0f172a" stroke-width="2.2" />
    <rect x="-7" y="8.5" width="14" height="4.5" rx="1.5" fill="#ffffff" />
    <path d="M-6 18 Q0 13 6 18 Q0 22 -6 18 Z" fill="#fb7185" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="275" height="58" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#facc15" stroke-width="3" />
    <text x="16" y="28" fill="#facc15" font-family="system-ui, sans-serif" font-size="22" font-weight="900">⚡ CHIMP DASH</text>
    <text x="16" y="48" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="800">6 FASES • 2P &amp; ONLINE</text>
  </g>
</svg>
