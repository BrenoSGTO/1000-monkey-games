<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Macacraft: Cava, Constrói e Banana — Click Macacos</title>
    <style>
      * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1a12;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; touch-action: none; }
      #app { position: relative; width: 100%; height: 100%; }
      canvas#game-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50;
        padding: 56px 12px 12px; overflow-y: auto; }
      .overlay.show { display: flex; }
      #title { background: radial-gradient(ellipse at 50% 40%, rgba(6,20,10,0.25), rgba(6,20,10,0.72)); }
      #pause, #loading { background: rgba(2, 8, 4, 0.72); }
      .card { width: min(460px, 100%); background: rgba(15, 23, 42, 0.9); border: 3px solid #facc15; border-radius: 22px;
        padding: 18px 20px 20px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.55); }
      h1.logo { margin: 0 0 2px; font-size: clamp(34px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; line-height: 1;
        color: #fde047; text-shadow: 0 4px 0 #a16207, 0 8px 0 rgba(0,0,0,0.4); }
      h1.logo span { color: #86efac; text-shadow: 0 4px 0 #166534, 0 8px 0 rgba(0,0,0,0.4); }
      .sub { margin: 4px 0 14px; color: #fef9c3; font-weight: 700; font-size: 15px; }
      .btn { display: block; width: 100%; margin: 8px 0; padding: 12px 14px; font-size: 17px; font-weight: 800; cursor: pointer;
        color: #1e293b; background: linear-gradient(180deg, #fde047, #facc15); border: 3px solid #a16207; border-radius: 14px;
        box-shadow: 0 4px 0 #a16207; transition: transform .08s; }
      .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
      .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #a16207; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn.green { background: linear-gradient(180deg, #86efac, #4ade80); border-color: #166534; box-shadow: 0 4px 0 #166534; }
      .btn.blue { background: linear-gradient(180deg, #bae6fd, #7dd3fc); border-color: #075985; box-shadow: 0 4px 0 #075985; }
      .btn.red { background: linear-gradient(180deg, #fecaca, #fca5a5); border-color: #991b1b; box-shadow: 0 4px 0 #991b1b; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row .btn { margin: 8px 0; flex: 0 0 auto; width: auto; }
      input.txt { flex: 1; min-width: 0; padding: 11px 12px; font-size: 16px; font-weight: 700; border-radius: 12px; border: 2px solid #475569;
        background: #0f172a; color: #fff; user-select: text; -webkit-user-select: text; text-transform: uppercase; }
      input.txt.seed { text-transform: none; }
      .help { margin-top: 12px; font-size: 12px; line-height: 1.55; color: #cbd5e1; text-align: left;
        background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 12px; }
      .help b { color: #fde047; }
      .spinner { font-size: 54px; animation: spin 1.2s linear infinite; display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #touch { position: absolute; inset: auto 0 0 0; height: 0; z-index: 40; display: none; }
      #touch.show { display: block; }
      #touch button { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 3px solid #facc15;
        background: rgba(15,23,42,0.6); color: #fff; font-size: 26px; font-weight: 900; touch-action: none; }
      #t-left { left: 14px; bottom: 90px; } #t-right { left: 92px; bottom: 90px; } #t-down { left: 53px; bottom: 20px; }
      #t-jump { right: 16px; bottom: 90px; width: 74px !important; height: 74px !important; background: rgba(250,204,21,0.35) !important; }
      #t-mode { right: 104px; bottom: 44px; } #t-inv { right: 16px; bottom: 20px; width: 56px !important; height: 56px !important; }
      #t-pause { right: 14px; top: 56px; bottom: auto; width: 46px !important; height: 46px !important; font-size: 20px !important; }
      #t-emote { right: 76px; top: 56px; bottom: auto; width: 46px !important; height: 46px !important; font-size: 20px !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="title" class="overlay show">
        <div class="card">
          <h1 class="logo">Maca<span>craft</span></h1>
          <div class="sub">Cava, Constrói e Banana 🍌⛏️</div>
          <button class="btn" id="btn-new">🌍 Novo Mundo</button>
          <div class="row" style="margin-top:-2px">
            <input class="txt seed" id="seed" placeholder="Semente (opcional)" maxlength="24" autocomplete="off" />
          </div>
          <button class="btn green" id="btn-continue">▶ Continuar</button>
          <div class="row">
            <input class="txt" id="join-code" placeholder="CÓDIGO DA SALA" maxlength="8" autocomplete="off" />
            <button class="btn blue" id="btn-join">🔗 Entrar na sala</button>
          </div>
          <button class="btn blue" id="btn-host">🐒 Criar sala Co-op (2-4 macacos)</button>
          <div class="help" style="text-align:center">
            🎮 <b>Controles:</b> aperte <b>F1</b> (ou o botão no topo) a qualquer hora.<br />
            À noite saem <b>Capivaras Zumbis</b> e <b>Pombos Explosivos</b>!
          </div>
        </div>
      </div>

      <div id="pause" class="overlay">
        <div class="card">
          <h1 class="logo" style="font-size:36px">Pausa</h1>
          <div class="sub">Macaco precisa de um café com banana ☕</div>
          <button class="btn green" id="btn-resume">▶ Continuar</button>
          <button class="btn" id="btn-save">💾 Salvar e voltar ao título</button>
          <button class="btn red" id="btn-pause-new">🌍 Novo Mundo (reiniciar)</button>
        </div>
      </div>

      <div id="loading" class="overlay">
        <div class="card">
          <div class="spinner">🍌</div>
          <h2 style="margin:8px 0 4px">Baixando a selva do host...</h2>
          <div class="sub">Plantando bananeiras e escavando cavernas</div>
        </div>
      </div>

      <div id="touch">
        <button id="t-left">◀</button><button id="t-right">▶</button><button id="t-down">▼</button>
        <button id="t-jump">⬆</button><button id="t-mode">⛏️</button><button id="t-inv">🎒</button>
        <button id="t-pause">⏸</button><button id="t-emote">🙊</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
