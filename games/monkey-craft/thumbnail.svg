<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46b2ff" />
      <stop offset="100%" stop-color="#d0f0ff" />
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.65" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb43c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff7814" stop-opacity="0" />
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="dirt" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#865c38" />
      <rect x="4" y="6" width="6" height="4" fill="#62401f" />
      <rect x="20" y="18" width="6" height="4" fill="#a87a50" />
      <rect x="10" y="24" width="4" height="4" fill="#62401f" />
      <rect x="24" y="4" width="4" height="4" fill="#9a9a9a" />
    </pattern>
    <pattern id="stone" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#7a7d84" />
      <rect x="6" y="4" width="8" height="4" fill="#5d6068" />
      <rect x="18" y="20" width="8" height="4" fill="#9a9da6" />
      <rect x="4" y="22" width="6" height="4" fill="#5d6068" />
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#sky)" />
  <!-- sol de óculos -->
  <g transform="translate(560 60)" filter="url(#sh)">
    <circle r="30" fill="#ffe45c" />
    <rect x="-21" y="-9" width="17" height="11" rx="3" fill="#1e293b" />
    <rect x="4" y="-9" width="17" height="11" rx="3" fill="#1e293b" />
    <rect x="-4" y="-6" width="8" height="2" fill="#1e293b" />
    <path d="M-12 8 Q0 18 12 8" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <!-- nuvens -->
  <ellipse cx="120" cy="60" rx="46" ry="16" fill="#fff" opacity="0.9" />
  <ellipse cx="96" cy="66" rx="28" ry="12" fill="#fff" opacity="0.9" />
  <ellipse cx="330" cy="40" rx="38" ry="13" fill="#fff" opacity="0.85" />

  <!-- terreno -->
  <rect x="0" y="176" width="640" height="48" fill="url(#dirt)" />
  <rect x="0" y="224" width="640" height="136" fill="url(#stone)" />
  <rect x="0" y="168" width="640" height="14" fill="#4aa844" />
  <rect x="0" y="168" width="640" height="4" fill="#70d64c" />
  <!-- caverna -->
  <rect x="352" y="256" width="192" height="96" fill="#2b1c10" />
  <rect x="384" y="224" width="64" height="32" fill="#2b1c10" />
  <rect x="0" y="224" width="640" height="136" fill="url(#dark)" />
  <!-- minérios -->
  <g>
    <rect x="96" y="288" width="32" height="32" fill="#7a7d84" />
    <circle cx="106" cy="298" r="6" fill="#cc7a42" /><circle cx="119" cy="310" r="5" fill="#cc7a42" />
    <rect x="224" y="320" width="32" height="32" fill="#7a7d84" />
    <circle cx="234" cy="330" r="6" fill="#f6cf3c" /><circle cx="247" cy="342" r="5" fill="#f6cf3c" />
    <rect x="320" y="288" width="32" height="32" fill="#58595f" />
    <path d="M330 296 q8 4 4 16 q-8 -4 -4 -16z" fill="#f4ef50" /><path d="M340 300 q6 3 3 12 q-6 -3 -3 -12z" fill="#fffaa0" />
  </g>

  <!-- bananeira -->
  <rect x="466" y="84" width="14" height="86" fill="#7a5028" />
  <rect x="466" y="100" width="14" height="3" fill="#5a3818" /><rect x="466" y="126" width="14" height="3" fill="#5a3818" /><rect x="466" y="150" width="14" height="3" fill="#5a3818" />
  <ellipse cx="473" cy="78" rx="62" ry="28" fill="#2a9a3c" />
  <ellipse cx="440" cy="92" rx="30" ry="14" fill="#35b04a" />
  <ellipse cx="508" cy="92" rx="30" ry="14" fill="#35b04a" />
  <path d="M440 104 q-4 22 4 38" stroke="#f8d63c" stroke-width="7" fill="none" stroke-linecap="round" />
  <path d="M452 104 q-2 24 8 38" stroke="#f8d63c" stroke-width="7" fill="none" stroke-linecap="round" />

  <!-- tocha + brilho -->
  <circle cx="410" cy="300" r="90" fill="url(#glow)" />
  <rect x="406" y="298" width="8" height="30" fill="#8a5a2a" />
  <ellipse cx="410" cy="292" rx="9" ry="13" fill="#ff9a1e" /><ellipse cx="410" cy="294" rx="4" ry="8" fill="#ffe680" />

  <!-- macaco minerador -->
  <g transform="translate(250 168)" filter="url(#sh)">
    <path d="M-16 -28 q-34 -4 -30 -34" stroke="#7a5230" stroke-width="7" fill="none" stroke-linecap="round" />
    <rect x="-14" y="-30" width="9" height="30" rx="4" fill="#7a5230" />
    <rect x="5" y="-30" width="9" height="30" rx="4" fill="#9b6a3a" />
    <ellipse cx="0" cy="-46" rx="17" ry="22" fill="#9b6a3a" />
    <ellipse cx="3" cy="-44" rx="10" ry="15" fill="#f2cfa2" />
    <ellipse cx="0" cy="-38" rx="17" ry="8" fill="#facc15" />
    <circle cx="-19" cy="-72" r="9" fill="#9b6a3a" /><circle cx="-19" cy="-72" r="5" fill="#e8a09c" />
    <circle cx="23" cy="-72" r="9" fill="#9b6a3a" /><circle cx="23" cy="-72" r="5" fill="#e8a09c" />
    <ellipse cx="2" cy="-74" rx="22" ry="20" fill="#9b6a3a" />
    <ellipse cx="2" cy="-72" rx="16" ry="14" fill="#f2cfa2" />
    <circle cx="-4" cy="-76" r="6" fill="#fff" /><circle cx="10" cy="-76" r="6" fill="#fff" />
    <circle cx="-2" cy="-76" r="2.6" fill="#1c1008" /><circle cx="8" cy="-76" r="2.6" fill="#1c1008" />
    <path d="M-4 -62 q6 6 12 0" stroke="#4a2a18" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <ellipse cx="8" cy="-60" rx="3" ry="4" fill="#ee7080" />
    <!-- picareta -->
    <g transform="translate(22 -40) rotate(-40)">
      <rect x="-3" y="-8" width="6" height="52" rx="2" fill="#8a5a2a" />
      <path d="M-30 -2 Q0 -26 30 -2 L24 4 Q0 -14 -24 4Z" fill="#f2c92c" stroke="#8a6a10" stroke-width="2" />
    </g>
    <rect x="14" y="-58" width="9" height="26" rx="4" fill="#9b6a3a" transform="rotate(-30 18 -58)" />
  </g>
  <!-- partículas de bloco -->
  <rect x="318" y="150" width="8" height="8" fill="#865c38" transform="rotate(20 322 154)" />
  <rect x="334" y="136" width="6" height="6" fill="#4aa844" />
  <rect x="346" y="152" width="6" height="6" fill="#a87a50" />

  <!-- pombo explosivo -->
  <g transform="translate(150 118) rotate(-8)" filter="url(#sh)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#a2a8b4" />
    <ellipse cx="18" cy="-8" rx="9" ry="8" fill="#9298a6" /><path d="M26 -10 l12 4 -12 4z" fill="#f0b040" />
    <circle cx="22" cy="-10" r="3" fill="#fff" /><circle cx="23" cy="-10" r="1.6" fill="#d01010" />
    <rect x="-9" y="2" width="5" height="14" fill="#d83030" /><rect x="-2" y="2" width="5" height="14" fill="#d83030" /><rect x="5" y="2" width="5" height="14" fill="#d83030" />
    <path d="M0 2 q4 -10 0 -16" stroke="#3a2a1a" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="-17" r="4" fill="#ffdd40" /><circle cx="0" cy="-17" r="2" fill="#fff" />
    <ellipse cx="-12" cy="-12" rx="18" ry="6" fill="#7e8492" transform="rotate(-30 -12 -12)" />
  </g>

  <!-- banner -->
  <g transform="translate(24 24)" filter="url(#sh)">
    <rect width="270" height="72" rx="16" fill="#1e293b" stroke="#facc15" stroke-width="4" />
    <text x="16" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#fde047">MACA<tspan fill="#86efac">CRAFT</tspan></text>
    <text x="16" y="60" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#e2e8f0">⛏️ Cava, Constrói e Banana • Co-op 1-4P</text>
  </g>
</svg>
