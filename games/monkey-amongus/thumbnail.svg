<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="alarmGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="redSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="yellowSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="cyanSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="faceMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.58"/>
    </filter>
  </defs>

  <!-- Space background -->
  <rect width="640" height="360" fill="url(#spaceBg)"/>
  <circle cx="320" cy="180" r="240" fill="url(#alarmGlow)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="42" r="2" opacity="0.9"/>
    <circle cx="115" cy="88" r="1.5" opacity="0.6"/>
    <circle cx="188" cy="34" r="2.2" opacity="0.8"/>
    <circle cx="272" cy="52" r="1.3" opacity="0.7"/>
    <circle cx="410" cy="36" r="2" opacity="0.85"/>
    <circle cx="520" cy="65" r="2.4" opacity="0.9"/>
    <circle cx="595" cy="44" r="1.6" opacity="0.65"/>
    <circle cx="62" cy="215" r="1.5" opacity="0.7"/>
    <circle cx="585" cy="195" r="2" opacity="0.8"/>
    <circle cx="140" cy="325" r="1.8" opacity="0.7"/>
    <circle cx="495" cy="318" r="2.1" opacity="0.75"/>
    <circle cx="36" cy="138" r="1.2" opacity="0.5"/>
  </g>

  <!-- Floating Banana Planet -->
  <g transform="translate(545 102) rotate(-18)">
    <path d="M-28 8 C-14 -24, 18 -26, 30 2 C12 -6, -8 -4, -28 8 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
    <circle cx="-12" cy="-8" r="3" fill="#fef08a"/>
  </g>

  <!-- Spaceship deck platform -->
  <ellipse cx="320" cy="290" rx="260" ry="52" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <ellipse cx="320" cy="284" rx="236" ry="40" fill="#334155"/>
  <!-- Vent grate -->
  <g transform="translate(278 274)">
    <rect x="0" y="0" width="84" height="26" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
    <line x1="12" y1="6" x2="72" y2="6" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="13" x2="72" y2="13" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="20" x2="72" y2="20" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Peeled banana skeleton on floor -->
  <g transform="translate(320 264)" filter="url(#shadow)">
    <path d="M-24 10 C-14 -4, 14 -4, 24 10 L14 14 L0 8 L-14 14 Z" fill="#facc15" stroke="#0f172a" stroke-width="2.8"/>
    <rect x="-5" y="-14" width="10" height="20" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="-4.5" cy="-16" r="4.5" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="4.5" cy="-16" r="4.5" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>
  </g>

  <!-- Center Background Monkey (Cyan peering) -->
  <g transform="translate(320 170) scale(0.76)" filter="url(#shadow)">
    <circle cx="-39" cy="-26" r="14" fill="#b45309" stroke="#0f172a" stroke-width="4"/>
    <circle cx="-39" cy="-26" r="7.5" fill="#fda4af"/>
    <circle cx="39" cy="-26" r="14" fill="#b45309" stroke="#0f172a" stroke-width="4"/>
    <circle cx="39" cy="-26" r="7.5" fill="#fda4af"/>
    <rect x="-36" y="-44" width="72" height="86" rx="34" fill="url(#cyanSuit)" stroke="#0f172a" stroke-width="4"/>
    <rect x="-26" y="-28" width="52" height="32" rx="15" fill="url(#visor)" stroke="#0f172a" stroke-width="3.8"/>
    <!-- Heart/peanut face inside visor -->
    <path d="M0 -22 C7 -28, 20 -22, 18 -12 C21 -3, 10 2, 0 0 C-10 2, -21 -3, -18 -12 C-20 -22, -7 -28, 0 -22 Z" fill="url(#faceMask)"/>
    <circle cx="-8" cy="-13" r="5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="-7" cy="-13" r="2.2" fill="#0f172a"/>
    <circle cx="-8.5" cy="-14.5" r="1" fill="#fff"/>
    <circle cx="8" cy="-13" r="5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="9" cy="-13" r="2.2" fill="#0f172a"/>
    <circle cx="7.5" cy="-14.5" r="1" fill="#fff"/>
    <path d="M-4 -5 Q0 -2 4 -5" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-21" rx="10" ry="3.5" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Left Monkey (Red Impostor with curved tail, ears, peanut face inside visor & pointing) -->
  <g transform="translate(152 206)" filter="url(#shadow)">
    <!-- Tail -->
    <path d="M-36 28 C-70 20, -78 -18, -54 -28" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <path d="M-36 28 C-70 20, -78 -18, -54 -28" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-54" cy="-28" r="4.5" fill="#fde68a"/>
    <!-- Backpack -->
    <rect x="-56" y="-14" width="22" height="54" rx="10" fill="#991b1b" stroke="#0f172a" stroke-width="4"/>
    <rect x="-50" y="-20" width="10" height="6" rx="2" fill="#94a3b8" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Ears -->
    <circle cx="-40" cy="-30" r="16" fill="#b45309" stroke="#0f172a" stroke-width="4"/>
    <circle cx="-40" cy="-30" r="8.5" fill="#fda4af"/>
    <circle cx="38" cy="-30" r="16" fill="#b45309" stroke="#0f172a" stroke-width="4"/>
    <circle cx="38" cy="-30" r="8.5" fill="#fda4af"/>
    <!-- Legs -->
    <rect x="-30" y="38" width="24" height="28" rx="10" fill="#b91c1c" stroke="#0f172a" stroke-width="4"/>
    <rect x="6" y="38" width="24" height="28" rx="10" fill="#b91c1c" stroke="#0f172a" stroke-width="4"/>
    <!-- Body/Head silhouette -->
    <rect x="-38" y="-48" width="76" height="98" rx="36" fill="url(#redSuit)" stroke="#0f172a" stroke-width="4"/>
    <!-- Visor -->
    <rect x="-10" y="-32" width="56" height="38" rx="18" fill="url(#visor)" stroke="#0f172a" stroke-width="4"/>
    <!-- Peanut/heart face inside visor -->
    <path d="M20 -26 C28 -33, 42 -26, 40 -14 C43 -3, 30 3, 20 1 C10 3, -3 -3, 0 -14 C-2 -26, 12 -33, 20 -26 Z" fill="url(#faceMask)"/>
    <!-- Suspicious eyes & highlights -->
    <circle cx="12" cy="-14" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="14.5" cy="-14" r="2.6" fill="#0f172a"/>
    <circle cx="13" cy="-15.8" r="1.1" fill="#ffffff"/>
    <circle cx="29" cy="-14" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="31.5" cy="-14" r="2.6" fill="#0f172a"/>
    <circle cx="30" cy="-15.8" r="1.1" fill="#ffffff"/>
    <line x1="6" y1="-22" x2="20" y2="-18" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="36" y1="-22" x2="22" y2="-18" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M16 -5 Q22 -1 28 -6" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="10" cy="-24" rx="13" ry="4.5" fill="#ffffff" opacity="0.55"/>
    <!-- Pointing arm & hand -->
    <path d="M32 10 L72 0" stroke="#0f172a" stroke-width="20" stroke-linecap="round"/>
    <path d="M32 10 L72 0" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
    <circle cx="75" cy="-1" r="9.5" fill="#ef4444" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Banana peel hat -->
    <path d="M-22 -47 C-14 -76, 14 -78, 24 -47 Q0 -54 -22 -47 Z" fill="#facc15" stroke="#0f172a" stroke-width="3.8"/>
    <circle cx="1" cy="-68" r="3.5" fill="#78350f"/>
  </g>

  <!-- Right Monkey (Yellow Crewmate shocked) -->
  <g transform="translate(488 208)" filter="url(#shadow)">
    <!-- Tail -->
    <path d="M36 28 C70 16, 74 -20, 50 -30" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <path d="M36 28 C70 16, 74 -20, 50 -30" fill="none" stroke="#a16207" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="-30" r="4.5" fill="#fde68a"/>
    <!-- Backpack -->
    <rect x="34" y="-14" width="22" height="54" rx="10" fill="#a16207" stroke="#0f172a" stroke-width="4"/>
    <!-- Ears -->
    <circle cx="-38" cy="-30" r="16" fill="#a16207" stroke="#0f172a" stroke-width="4"/>
    <circle cx="-38" cy="-30" r="8.5" fill="#fda4af"/>
    <circle cx="40" cy="-30" r="16" fill="#a16207" stroke="#0f172a" stroke-width="4"/>
    <circle cx="40" cy="-30" r="8.5" fill="#fda4af"/>
    <!-- Legs -->
    <rect x="-30" y="38" width="24" height="28" rx="10" fill="#ca8a04" stroke="#0f172a" stroke-width="4"/>
    <rect x="6" y="38" width="24" height="28" rx="10" fill="#ca8a04" stroke="#0f172a" stroke-width="4"/>
    <!-- Body -->
    <rect x="-38" y="-48" width="76" height="98" rx="36" fill="url(#yellowSuit)" stroke="#0f172a" stroke-width="4"/>
    <!-- Visor -->
    <rect x="-46" y="-32" width="56" height="38" rx="18" fill="url(#visor)" stroke="#0f172a" stroke-width="4"/>
    <!-- Peanut/heart face inside visor -->
    <path d="M-20 -26 C-12 -33, 2 -26, 0 -14 C3 -3, -10 3, -20 1 C-30 3, -43 -3, -40 -14 C-42 -26, -28 -33, -20 -26 Z" fill="url(#faceMask)"/>
    <!-- Shocked Googly eyes -->
    <circle cx="-28" cy="-14" r="6.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="-30" cy="-13" r="2.6" fill="#0f172a"/>
    <circle cx="-31.5" cy="-14.5" r="1.1" fill="#ffffff"/>
    <circle cx="-11" cy="-14" r="6.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="-13" cy="-15" r="2.6" fill="#0f172a"/>
    <circle cx="-14.5" cy="-16.5" r="1.1" fill="#ffffff"/>
    <ellipse cx="-19.5" cy="-4.5" rx="4" ry="4.5" fill="#7f1d1d"/>
    <ellipse cx="-26" cy="-24" rx="13" ry="4.5" fill="#ffffff" opacity="0.55"/>
    <!-- Pointing arm -->
    <path d="M-32 10 L-72 0" stroke="#0f172a" stroke-width="20" stroke-linecap="round"/>
    <path d="M-32 10 L-72 0" stroke="#facc15" stroke-width="13" stroke-linecap="round"/>
    <circle cx="-75" cy="-1" r="9.5" fill="#facc15" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Crown -->
    <polygon points="-22,-46 -26,-70 -9,-57 0,-74 9,-57 26,-70 22,-46" fill="#fbbf24" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="0" cy="-56" r="3.5" fill="#ef4444"/>
  </g>

  <!-- SUS speech bubble -->
  <g transform="translate(320 104)">
    <rect x="-56" y="-22" width="112" height="32" rx="16" fill="#ef4444" stroke="#0f172a" stroke-width="3"/>
    <text x="0" y="-1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff">SUS DEMAIS!</text>
  </g>

  <!-- Title Banner -->
  <g transform="translate(320 46)">
    <rect x="-235" y="-28" width="470" height="52" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#facc15" stroke-width="3.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#facc15" letter-spacing="0.5">ENTRE MACACOS</text>
    <text x="0" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fca5a5" letter-spacing="1.5">QUEM ROUBOU A BANANA?</text>
  </g>
</svg>
