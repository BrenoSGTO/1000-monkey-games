<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f3e8" />
      <stop offset="100%" stop-color="#e5eedb" />
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Jungle Cream Background -->
  <rect width="640" height="360" fill="url(#bg)" />

  <!-- Subtle Grid -->
  <g stroke="#d6d3c4" stroke-width="1" opacity="0.5">
    <path d="M0 60 H640 M0 120 H640 M0 180 H640 M0 240 H640 M0 300 H640" />
    <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360" />
  </g>

  <!-- Winding River -->
  <path d="M360 -10 C 310 90, 420 180, 340 270 C 300 315, 330 350, 355 370"
        fill="none" stroke="#bae6fd" stroke-width="58" stroke-linecap="round" />
  <path d="M360 -10 C 310 90, 420 180, 340 270 C 300 315, 330 350, 355 370"
        fill="none" stroke="url(#river)" stroke-width="44" stroke-linecap="round" />

  <!-- Jungle Palm Clusters -->
  <g fill="#22c55e" opacity="0.35">
    <circle cx="72" cy="295" r="24" />
    <circle cx="100" cy="310" r="18" />
    <circle cx="565" cy="65" r="28" />
    <circle cx="595" cy="90" r="20" />
  </g>

  <!-- Road Casing -->
  <g fill="none" stroke="#cbd5e1" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 100 L 210 100 L 260 150 L 260 220 L 450 220 L 520 150" />
    <path d="M120 240 L 260 220" />
    <path d="M260 150 L 260 75 L 490 75" />
  </g>

  <!-- Road Asphalt -->
  <g fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 100 L 210 100 L 260 150 L 260 220 L 450 220 L 520 150" />
    <path d="M120 240 L 260 220" />
    <path d="M260 150 L 260 75 L 490 75" />
  </g>

  <!-- Bamboo Bridge over River -->
  <g transform="translate(310, 200)">
    <rect x="0" y="0" width="90" height="34" rx="6" fill="#d97706" stroke="#78350f" stroke-width="3" />
    <rect x="4" y="6" width="82" height="22" rx="3" fill="#475569" />
    <line x1="15" y1="0" x2="15" y2="34" stroke="#92400e" stroke-width="3" />
    <line x1="45" y1="0" x2="45" y2="34" stroke="#92400e" stroke-width="3" />
    <line x1="75" y1="0" x2="75" y2="34" stroke="#92400e" stroke-width="3" />
  </g>

  <!-- Roundabout -->
  <circle cx="260" cy="220" r="28" fill="#334155" stroke="#cbd5e1" stroke-width="4" />
  <circle cx="260" cy="220" r="12" fill="#4ade80" stroke="#166534" stroke-width="3" />

  <!-- Vine Expressway (Via Expressa de Cipó) -->
  <path d="M90 100 Q 300 5 520 150" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="16" stroke-linecap="round" transform="translate(0, 12)" />
  <path d="M90 100 Q 300 5 520 150" fill="none" stroke="#15803d" stroke-width="18" stroke-linecap="round" />
  <path d="M90 100 Q 300 5 520 150" fill="none" stroke="#84cc16" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 8" />

  <!-- Houses with Minimalist Peeking Monkeys -->
  <!-- Yellow House -->
  <g transform="translate(68, 78)">
    <circle cx="22" cy="22" r="23" fill="#facc15" stroke="#854d0e" stroke-width="3" />
    <circle cx="22" cy="22" r="16" fill="#fef08a" opacity="0.45" />
    <text x="12" y="25" text-anchor="middle" font-size="14">🍌</text>
    <!-- Peeking Monkey -->
    <g transform="translate(31, 21)">
      <circle cx="-7" cy="0" r="3.5" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
      <circle cx="-7" cy="0" r="1.8" fill="#fda4af" />
      <circle cx="7" cy="0" r="3.5" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
      <circle cx="7" cy="0" r="1.8" fill="#fda4af" />
      <circle cx="0" cy="0" r="7.5" fill="url(#fur)" stroke="#451a03" stroke-width="1.5" />
      <ellipse cx="0" cy="2.2" rx="5.5" ry="3.8" fill="#fde68a" />
      <circle cx="-2.4" cy="-1.2" r="1.3" fill="#0f172a" />
      <circle cx="2.4" cy="-1.2" r="1.3" fill="#0f172a" />
      <circle cx="-2.8" cy="-1.6" r="0.5" fill="#fff" />
      <circle cx="2" cy="-1.6" r="0.5" fill="#fff" />
      <path d="M-2.2 2.2 Q0 4.4 2.2 2.2" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
  <!-- Red House -->
  <g transform="translate(98, 218)">
    <polygon points="22,-3 46,22 22,47 -2,22" fill="#ef4444" stroke="#7f1d1d" stroke-width="3" />
    <text x="22" y="27" text-anchor="middle" font-size="15">🥭</text>
  </g>

  <!-- Markets -->
  <!-- Yellow Banana Market -->
  <g transform="translate(492, 114)">
    <rect width="74" height="74" rx="14" fill="#facc15" stroke="#854d0e" stroke-width="4" />
    <rect x="10" y="10" width="54" height="22" rx="6" fill="#fef9c3" />
    <text x="37" y="54" text-anchor="middle" font-size="24">🍌</text>
    <circle cx="66" cy="8" r="11" fill="#1e293b" stroke="#facc15" stroke-width="3" />
    <circle cx="66" cy="8" r="5" fill="#facc15" />
  </g>

  <!-- Red Mango Market -->
  <g transform="translate(462, 42)">
    <rect width="66" height="66" rx="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="4" />
    <text x="33" y="43" text-anchor="middle" font-size="22">🥭</text>
  </g>

  <!-- Monkey Cars (Minimalist Convertible + Detailed Monkeys) -->
  <!-- Car 1 (Yellow, Happy Cruiser) -->
  <g transform="translate(172, 100) scale(1.25)">
    <path d="M-15 0 Q-23 -4 -26 -1" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />
    <rect x="-15" y="-10" width="30" height="20" rx="6" fill="#facc15" stroke="#854d0e" stroke-width="2" />
    <rect x="-8" y="-7" width="14" height="14" rx="3" fill="rgba(15,23,42,0.22)" />
    <rect x="6" y="-6.5" width="3.5" height="13" rx="1.5" fill="#bae6fd" />
    <!-- Monkey Driver -->
    <circle cx="-1" cy="-8.5" r="3.8" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
    <circle cx="-0.5" cy="-8.2" r="1.9" fill="#fda4af" />
    <circle cx="-1" cy="8.5" r="3.8" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
    <circle cx="-0.5" cy="8.2" r="1.9" fill="#fda4af" />
    <circle cx="0" cy="0" r="8" fill="url(#fur)" stroke="#451a03" stroke-width="1.4" />
    <ellipse cx="3" cy="-2" rx="3.8" ry="2.8" fill="#fde68a" />
    <ellipse cx="3" cy="2" rx="3.8" ry="2.8" fill="#fde68a" />
    <ellipse cx="4.5" cy="0" rx="3" ry="4.2" fill="#fde68a" />
    <circle cx="3" cy="-2.7" r="2.2" fill="#fff" />
    <circle cx="3" cy="2.7" r="2.2" fill="#fff" />
    <circle cx="3.6" cy="-2.7" r="1.1" fill="#0f172a" />
    <circle cx="3.6" cy="2.7" r="1.1" fill="#0f172a" />
    <circle cx="3.3" cy="-3.1" r="0.45" fill="#fff" />
    <circle cx="3.3" cy="2.3" r="0.45" fill="#fff" />
    <path d="M5.2 -1.8 Q7 0 5.2 1.8" fill="none" stroke="#78350f" stroke-width="1.1" stroke-linecap="round" />
  </g>

  <!-- Car 2 (Red, Stuck & Furious!) -->
  <g transform="translate(208, 224) rotate(-10) scale(1.3)">
    <path d="M-15 0 Q-23 5 -26 -2" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />
    <rect x="-15" y="-10" width="30" height="20" rx="6" fill="#ef4444" stroke="#7f1d1d" stroke-width="2" />
    <rect x="-8" y="-7" width="14" height="14" rx="3" fill="rgba(15,23,42,0.22)" />
    <rect x="6" y="-6.5" width="3.5" height="13" rx="1.5" fill="#bae6fd" />
    <circle cx="-1" cy="-8.5" r="3.8" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
    <circle cx="-0.5" cy="-8.2" r="1.9" fill="#fda4af" />
    <circle cx="-1" cy="8.5" r="3.8" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
    <circle cx="-0.5" cy="8.2" r="1.9" fill="#fda4af" />
    <circle cx="0" cy="0" r="8" fill="url(#fur)" stroke="#451a03" stroke-width="1.4" />
    <ellipse cx="4.2" cy="0" rx="3.4" ry="4.5" fill="#fde68a" />
    <circle cx="3" cy="-2.7" r="2.2" fill="#fff" />
    <circle cx="3" cy="2.7" r="2.2" fill="#fff" />
    <circle cx="3.5" cy="-2.7" r="1.1" fill="#0f172a" />
    <circle cx="3.5" cy="2.7" r="1.1" fill="#0f172a" />
    <path d="M1 -4.6 L4.2 -1.2 M1 4.6 L4.2 1.2" stroke="#991b1b" stroke-width="1.4" stroke-linecap="round" />
    <ellipse cx="5.8" cy="0" rx="1.6" ry="2.2" fill="#991b1b" />
    <path d="M17 -5 A6 6 0 0 1 17 5" fill="none" stroke="#fde047" stroke-width="1.8" stroke-linecap="round" />
  </g>
  <!-- Rage Bubble -->
  <g transform="translate(200, 182)">
    <rect x="-24" y="-14" width="48" height="24" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.2" />
    <polygon points="-4,10 4,10 2,16" fill="#ffffff" />
    <text x="0" y="2" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#0f172a">BIIIP!</text>
  </g>

  <!-- Car 3 Zooming on Cipó Expressway (Blue Coco Car!) -->
  <g transform="translate(310, 62) rotate(5) scale(1.3)">
    <path d="M-15 0 Q-24 -6 -27 2" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />
    <rect x="-15" y="-10" width="30" height="20" rx="6" fill="#38bdf8" stroke="#0369a1" stroke-width="2" />
    <rect x="-8" y="-7" width="14" height="14" rx="3" fill="rgba(15,23,42,0.22)" />
    <rect x="6" y="-6.5" width="3.5" height="13" rx="1.5" fill="#e0f2fe" />
    <circle cx="-1" cy="-8.5" r="3.8" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
    <circle cx="-0.5" cy="-8.2" r="1.9" fill="#fda4af" />
    <circle cx="-1" cy="8.5" r="3.8" fill="#78350f" stroke="#451a03" stroke-width="1.2" />
    <circle cx="-0.5" cy="8.2" r="1.9" fill="#fda4af" />
    <circle cx="0" cy="0" r="8" fill="url(#fur)" stroke="#451a03" stroke-width="1.4" />
    <ellipse cx="4.2" cy="0" rx="3.4" ry="4.5" fill="#fde68a" />
    <circle cx="3" cy="-2.7" r="2.2" fill="#fff" />
    <circle cx="3" cy="2.7" r="2.2" fill="#fff" />
    <circle cx="3.8" cy="-2.7" r="1.1" fill="#0f172a" />
    <circle cx="3.8" cy="2.7" r="1.1" fill="#0f172a" />
    <circle cx="3.5" cy="-3.1" r="0.45" fill="#fff" />
    <circle cx="3.5" cy="2.3" r="0.45" fill="#fff" />
    <path d="M5 -2.2 A2.5 2.5 0 0 1 5 2.2 Z" fill="#991b1b" />
  </g>

  <!-- Title Ribbon -->
  <g transform="translate(22, 18)">
    <rect width="238" height="44" rx="12" fill="rgba(17,24,39,0.9)" stroke="#facc15" stroke-width="2.5" />
    <text x="16" y="29" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="900" font-size="19">🐒 MINI MACACOWAYS</text>
  </g>
</svg>
