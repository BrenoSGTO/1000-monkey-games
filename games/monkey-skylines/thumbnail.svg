<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Sun & Jungle Clouds -->
  <circle cx="535" cy="72" r="38" fill="#fde047" opacity="0.95"/>
  <circle cx="535" cy="72" r="50" fill="#fef08a" opacity="0.35"/>
  <g fill="#ffffff" opacity="0.88">
    <ellipse cx="120" cy="68" rx="44" ry="18"/>
    <ellipse cx="148" cy="60" rx="28" ry="18"/>
    <ellipse cx="92" cy="70" rx="26" ry="14"/>
    <ellipse cx="420" cy="54" rx="38" ry="15"/>
    <ellipse cx="445" cy="48" rx="24" ry="14"/>
  </g>

  <!-- Jungle hills -->
  <path d="M0 205 Q95 145 190 195 T390 185 T640 195 L640 360 L0 360 Z" fill="#166534"/>
  <path d="M0 225 Q160 185 320 220 T640 210 L640 360 L0 360 Z" fill="url(#ground)"/>

  <!-- River & Banana Bridge -->
  <path d="M-20 275 Q170 245 310 285 T660 270 L660 325 Q470 335 305 320 T-20 315 Z" fill="url(#river)" stroke="#bae6fd" stroke-width="3"/>

  <!-- Isometric Road -->
  <polygon points="80,255 560,210 585,232 105,280" fill="#334155" stroke="#1e293b" stroke-width="3"/>
  <line x1="105" y1="266" x2="565" y2="221" stroke="#facc15" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- Left: Banana Peel Power Plant -->
  <g transform="translate(56,120)">
    <rect x="8" y="45" width="76" height="82" rx="6" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <rect x="18" y="14" width="22" height="40" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
    <rect x="48" y="20" width="22" height="34" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
    <!-- Smoke puffs -->
    <circle cx="29" cy="4" r="10" fill="#fef08a" opacity="0.85"/>
    <circle cx="42" cy="-8" r="13" fill="#fde047" opacity="0.65"/>
    <!-- Bolt badge -->
    <polygon points="48,64 36,86 46,86 42,108 58,82 48,82" fill="#facc15" stroke="#713f12" stroke-width="2"/>
  </g>

  <!-- Center-Left: Colorful Monkey Apartments -->
  <g transform="translate(158,92)">
    <rect x="0" y="34" width="66" height="106" rx="5" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
    <polygon points="-4,34 33,12 70,34" fill="#ef4444" stroke="#7c2d12" stroke-width="3"/>
    <rect x="10" y="48" width="16" height="16" rx="2" fill="#fef08a"/>
    <rect x="40" y="48" width="16" height="16" rx="2" fill="#fef08a"/>
    <rect x="10" y="76" width="16" height="16" rx="2" fill="#fef08a"/>
    <rect x="40" y="76" width="16" height="16" rx="2" fill="#38bdf8"/>
    <rect x="10" y="104" width="16" height="16" rx="2" fill="#fef08a"/>
    <rect x="40" y="104" width="16" height="16" rx="2" fill="#fef08a"/>
  </g>

  <!-- Center: Golden Bald Monkey Statue -->
  <g transform="translate(268,125)">
    <rect x="8" y="68" width="54" height="34" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
    <circle cx="35" cy="42" r="22" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    <circle cx="14" cy="42" r="8" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
    <circle cx="56" cy="42" r="8" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
    <ellipse cx="35" cy="48" rx="14" ry="10" fill="#fef08a"/>
    <!-- Shiny bald head glint -->
    <path d="M26 24 Q35 19 42 25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="37" r="3" fill="#451a03"/>
    <circle cx="42" cy="37" r="3" fill="#451a03"/>
    <path d="M27 50 Q35 56 43 50" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Giant Plush Gorilla stomping on the right! -->
  <g transform="translate(415,72)">
    <!-- Body -->
    <ellipse cx="78" cy="115" rx="52" ry="62" fill="#7c3aed" stroke="#2e1065" stroke-width="4"/>
    <ellipse cx="78" cy="122" rx="34" ry="42" fill="#c4b5fd"/>
    <!-- Stitch line -->
    <line x1="78" y1="84" x2="78" y2="156" stroke="#4c1d95" stroke-width="2.5" stroke-dasharray="5 4"/>
    <!-- Arms -->
    <ellipse cx="22" cy="112" rx="22" ry="16" transform="rotate(-25 22 112)" fill="#7c3aed" stroke="#2e1065" stroke-width="4"/>
    <ellipse cx="132" cy="100" rx="22" ry="16" transform="rotate(28 132 100)" fill="#7c3aed" stroke="#2e1065" stroke-width="4"/>
    <!-- Head -->
    <circle cx="78" cy="52" r="34" fill="#7c3aed" stroke="#2e1065" stroke-width="4"/>
    <circle cx="42" cy="50" r="11" fill="#c4b5fd" stroke="#2e1065" stroke-width="3"/>
    <circle cx="114" cy="50" r="11" fill="#c4b5fd" stroke="#2e1065" stroke-width="3"/>
    <ellipse cx="78" cy="62" rx="24" ry="16" fill="#ddd6fe"/>
    <!-- Goofy Button Eyes -->
    <circle cx="65" cy="44" r="8" fill="#fef08a" stroke="#2e1065" stroke-width="2.5"/>
    <line x1="61" y1="40" x2="69" y2="48" stroke="#2e1065" stroke-width="2"/>
    <line x1="69" y1="40" x2="61" y2="48" stroke="#2e1065" stroke-width="2"/>
    <circle cx="92" cy="46" r="10" fill="#fef08a" stroke="#2e1065" stroke-width="2.5"/>
    <circle cx="94" cy="46" r="3.5" fill="#1e1b4b"/>
    <path d="M64 67 Q78 78 92 65" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Traffic Jam Banana Cars -->
  <g transform="translate(152,248)">
    <rect x="0" y="4" width="38" height="16" rx="8" fill="#facc15" stroke="#713f12" stroke-width="2.5"/>
    <circle cx="9" cy="20" r="4.5" fill="#1e293b"/>
    <circle cx="29" cy="20" r="4.5" fill="#1e293b"/>
    <rect x="46" y="0" width="38" height="16" rx="8" fill="#fb7185" stroke="#881337" stroke-width="2.5"/>
    <circle cx="55" cy="16" r="4.5" fill="#1e293b"/>
    <circle cx="75" cy="16" r="4.5" fill="#1e293b"/>
    <text x="16" y="-5" font-family="Arial Black, sans-serif" font-size="13" fill="#ef4444" stroke="#ffffff" stroke-width="0.6">BEEP!</text>
  </g>

  <!-- Title Banner -->
  <g transform="translate(22,18)">
    <rect x="0" y="0" width="338" height="62" rx="14" fill="#111827" opacity="0.9" stroke="#facc15" stroke-width="3"/>
    <text x="16" y="29" font-family="Arial Black, Impact, sans-serif" font-size="23" fill="#facc15">SIMMACACO</text>
    <text x="16" y="50" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#fef08a">PREFEITURA DO CAOS 🍌🏙️</text>
  </g>
</svg>
