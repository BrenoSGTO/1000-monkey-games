<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="trainRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="trainTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#155e75" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Tropical Sunset Sky -->
  <rect width="640" height="175" fill="url(#sky)" />
  <circle cx="320" cy="148" r="56" fill="#fef08a" opacity="0.85" />

  <!-- Jungle Mountains & Favela Silhouettes -->
  <path d="M0 170 Q95 95 210 155 Q320 115 440 155 Q545 100 640 165 L640 185 L0 185 Z" fill="#14532d" />
  <g fill="#7c2d12" stroke="#1c1917" stroke-width="2">
    <rect x="14" y="122" width="42" height="52" />
    <rect x="60" y="136" width="38" height="38" fill="#0369a1" />
    <rect x="20" y="96" width="34" height="28" fill="#ca8a04" />
    <rect x="546" y="126" width="44" height="48" fill="#b91c1c" />
    <rect x="594" y="114" width="36" height="60" fill="#15803d" />
    <rect x="558" y="102" width="32" height="26" fill="#d97706" />
  </g>

  <!-- Palm Leaves -->
  <g fill="#166534">
    <path d="M120 175 L112 108 L124 108 L128 175 Z" />
    <path d="M118 110 Q75 88 50 118 Q90 110 118 110 Z" />
    <path d="M118 110 Q152 82 182 108 Q145 106 118 110 Z" />
    <path d="M518 175 L512 105 L524 105 L528 175 Z" />
    <path d="M518 106 Q478 82 454 112 Q492 105 518 106 Z" />
    <path d="M518 106 Q558 84 584 114 Q546 106 518 106 Z" />
  </g>

  <!-- Perspective Track Bed -->
  <rect x="0" y="170" width="640" height="190" fill="url(#ground)" />
  <polygon points="270,170 370,170 620,360 20,360" fill="#292524" />

  <!-- Wooden Sleepers -->
  <g stroke="#78350f" stroke-width="5" opacity="0.75">
    <line x1="230" y1="190" x2="410" y2="190" />
    <line x1="192" y1="215" x2="448" y2="215" />
    <line x1="145" y1="246" x2="495" y2="246" />
    <line x1="88" y1="285" x2="552" y2="285" />
    <line x1="25" y1="332" x2="615" y2="332" />
  </g>

  <!-- 3 Converging Rails -->
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="286" y1="170" x2="80" y2="360" />
    <line x1="302" y1="170" x2="180" y2="360" />
    <line x1="312" y1="170" x2="265" y2="360" />
    <line x1="328" y1="170" x2="375" y2="360" />
    <line x1="338" y1="170" x2="460" y2="360" />
    <line x1="354" y1="170" x2="560" y2="360" />
  </g>

  <!-- Left Graffiti Train -->
  <g filter="url(#shadow)">
    <polygon points="105,155 245,155 215,275 45,275" fill="url(#trainRed)" stroke="#1e293b" stroke-width="3" />
    <polygon points="105,155 245,155 260,136 132,136" fill="#f87171" stroke="#1e293b" stroke-width="2" />
    <rect x="92" y="182" width="96" height="44" rx="6" fill="#fef08a" stroke="#1e293b" stroke-width="2.5" transform="skewX(-12)" />
    <text x="80" y="212" fill="#dc2626" font-family="system-ui, sans-serif" font-size="18" font-weight="900">BANANA</text>
  </g>

  <!-- Right Moving Train with Headlight -->
  <g filter="url(#shadow)">
    <polygon points="395,155 535,155 595,275 425,275" fill="url(#trainTeal)" stroke="#1e293b" stroke-width="3" />
    <polygon points="395,155 535,155 508,136 380,136" fill="#22d3ee" stroke="#1e293b" stroke-width="2" />
    <rect x="435" y="176" width="94" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="465" cy="242" r="12" fill="#fef08a" />
    <circle cx="535" cy="242" r="12" fill="#fef08a" />
  </g>

  <!-- Banana Coins on Center Track -->
  <g fill="#facc15" stroke="#854d0e" stroke-width="2.5">
    <ellipse cx="320" cy="202" rx="10" ry="13" />
    <ellipse cx="320" cy="235" rx="13" ry="16" />
    <ellipse cx="320" cy="276" rx="16" ry="20" />
  </g>

  <!-- Angry Gorilla Guard & Capybara Dog Chasing -->
  <g transform="translate(156, 286)" filter="url(#shadow)">
    <ellipse cx="0" cy="24" rx="34" ry="28" fill="#1e293b" stroke="#090d16" stroke-width="3" />
    <circle cx="0" cy="-6" r="22" fill="#334155" stroke="#090d16" stroke-width="3" />
    <ellipse cx="0" cy="2" rx="14" ry="10" fill="#94a3b8" />
    <!-- Security Cap -->
    <path d="M-20 -16 Q0 -34 20 -16 Z" fill="#1d4ed8" stroke="#090d16" stroke-width="2.5" />
    <rect x="-24" y="-18" width="48" height="7" rx="3" fill="#1e3a8a" />
    <!-- Angry Eyes -->
    <line x1="-12" y1="-12" x2="-3" y2="-7" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="-12" x2="3" y2="-7" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <circle cx="-7" cy="-5" r="3" fill="#ef4444" />
    <circle cx="7" cy="-5" r="3" fill="#ef4444" />
    <!-- Capybara Dog -->
    <g transform="translate(52, 22)">
      <ellipse cx="0" cy="10" rx="18" ry="12" fill="#92400e" stroke="#1c1917" stroke-width="2.5" />
      <rect x="-12" y="2" width="16" height="4" fill="#ef4444" />
      <circle cx="14" cy="4" r="9" fill="#92400e" stroke="#1c1917" stroke-width="2.5" />
      <circle cx="17" cy="2" r="2" fill="#0f172a" />
    </g>
  </g>

  <!-- Hero Graffiti Monkey Surfing on Cipó-Board -->
  <g transform="translate(344, 240) rotate(-6)" filter="url(#shadow)">
    <!-- Hoverboard -->
    <ellipse cx="0" cy="54" rx="44" ry="12" fill="#22c55e" stroke="#14532d" stroke-width="3" />
    <path d="M-30 54 L30 54" stroke="#fde047" stroke-width="3" stroke-dasharray="6 4" />
    <!-- Curled Tail -->
    <path d="M-12 24 Q-48 20 -42 -6 Q-36 -20 -26 -10" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round" />
    <!-- Hoodie Body -->
    <rect x="-20" y="-4" width="40" height="44" rx="14" fill="#facc15" stroke="#1c1917" stroke-width="3" />
    <!-- Spray Can in Hand -->
    <g transform="translate(28, 6) rotate(20)">
      <rect x="-6" y="-12" width="12" height="22" rx="3" fill="#ec4899" stroke="#1c1917" stroke-width="2" />
      <rect x="-3" y="-16" width="6" height="4" fill="#f8fafc" />
    </g>
    <!-- Head & Backwards Cap -->
    <circle cx="-18" cy="-24" r="10" fill="#92400e" stroke="#1c1917" stroke-width="2.5" />
    <circle cx="18" cy="-24" r="10" fill="#92400e" stroke="#1c1917" stroke-width="2.5" />
    <circle cx="0" cy="-24" r="20" fill="#92400e" stroke="#1c1917" stroke-width="3" />
    <ellipse cx="0" cy="-18" rx="14" ry="10" fill="#fde68a" />
    <path d="M-18 -30 Q0 -50 18 -30 Z" fill="#ef4444" stroke="#1c1917" stroke-width="2.5" />
    <rect x="8" y="-33" width="18" height="6" rx="3" fill="#b91c1c" stroke="#1c1917" stroke-width="2" />
    <!-- Goofy Wide Eyes Looking Back -->
    <circle cx="-6" cy="-24" r="5" fill="#fff" stroke="#1c1917" stroke-width="1.5" />
    <circle cx="6" cy="-24" r="5" fill="#fff" stroke="#1c1917" stroke-width="1.5" />
    <circle cx="-7" cy="-24" r="2.2" fill="#0f172a" />
    <circle cx="5" cy="-24" r="2.2" fill="#0f172a" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(18, 18)" filter="url(#shadow)">
    <rect x="0" y="0" width="335" height="64" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#facc15" stroke-width="3" />
    <text x="16" y="31" fill="#facc15" font-family="system-ui, sans-serif" font-size="22" font-weight="900">🚝 CIPÓ SURFERS</text>
    <text x="16" y="52" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="800">FUGA DO ZELADOR • 3 FAIXAS • VERSUS P2P</text>
  </g>
</svg>
