<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="55%" stop-color="#171936" />
      <stop offset="100%" stop-color="#2b1408" />
    </linearGradient>
    <linearGradient id="boardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Jungle Temple Background -->
  <rect width="640" height="360" fill="url(#bg)" />
  <circle cx="540" cy="80" r="85" fill="#facc15" opacity="0.1" />
  <circle cx="110" cy="290" r="95" fill="#22c55e" opacity="0.1" />

  <!-- Decorative Palm Leaves -->
  <g fill="#14532d" opacity="0.65">
    <path d="M-10 40 Q65 10 125 65 Q60 58 -10 85 Z" />
    <path d="M-10 100 Q55 75 105 128 Q45 118 -10 140 Z" />
    <path d="M650 35 Q570 15 510 70 Q575 60 650 90 Z" />
    <path d="M650 110 Q585 95 545 142 Q600 130 650 155 Z" />
  </g>

  <!-- Central Tetris Board -->
  <g transform="translate(215, 22)">
    <rect x="-8" y="-8" width="216" height="328" rx="14" fill="#422006" stroke="#facc15" stroke-width="4" />
    <rect x="0" y="0" width="200" height="312" rx="8" fill="url(#boardBg)" />
    <!-- Subtle grid -->
    <g stroke="#334155" stroke-opacity="0.35" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="312" />
      <line x1="80" y1="0" x2="80" y2="312" />
      <line x1="120" y1="0" x2="120" y2="312" />
      <line x1="160" y1="0" x2="160" y2="312" />
      <line x1="0" y1="78" x2="200" y2="78" />
      <line x1="0" y1="156" x2="200" y2="156" />
      <line x1="0" y1="234" x2="200" y2="234" />
    </g>

    <!-- Bottom Stacked Crates (Line Clear Glow!) -->
    <rect x="4" y="274" width="192" height="34" rx="6" fill="#fde047" opacity="0.28" filter="url(#glow)" />
    <g stroke="#0f172a" stroke-width="2.5">
      <rect x="4" y="274" width="36" height="34" rx="5" fill="url(#greenGrad)" />
      <rect x="43" y="274" width="36" height="34" rx="5" fill="url(#goldGrad)" />
      <rect x="82" y="274" width="36" height="34" rx="5" fill="url(#orangeGrad)" />
      <rect x="121" y="274" width="36" height="34" rx="5" fill="url(#blueGrad)" />
      <rect x="160" y="274" width="36" height="34" rx="5" fill="url(#redGrad)" />

      <!-- Row above -->
      <rect x="4" y="236" width="36" height="34" rx="5" fill="url(#greenGrad)" />
      <rect x="43" y="236" width="36" height="34" rx="5" fill="url(#goldGrad)" />
      <rect x="121" y="236" width="36" height="34" rx="5" fill="url(#blueGrad)" />
      <rect x="160" y="236" width="36" height="34" rx="5" fill="url(#orangeGrad)" />

      <!-- Row 3 -->
      <rect x="4" y="198" width="36" height="34" rx="5" fill="url(#redGrad)" />
      <rect x="160" y="198" width="36" height="34" rx="5" fill="url(#blueGrad)" />
    </g>

    <!-- Ghost Piece -->
    <g stroke="#e879f9" stroke-width="2.5" stroke-dasharray="4 3" fill="#e879f9" fill-opacity="0.12">
      <rect x="82" y="198" width="36" height="34" rx="5" />
      <rect x="43" y="236" width="36" height="34" rx="5" />
      <rect x="82" y="236" width="36" height="34" rx="5" />
      <rect x="121" y="236" width="36" height="34" rx="5" />
    </g>

    <!-- Falling T-Piece with Squished Monkey! -->
    <g transform="translate(0, -10)">
      <!-- Drop streaks -->
      <line x1="60" y1="15" x2="60" y2="75" stroke="#f0abfc" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round" />
      <line x1="100" y1="0" x2="100" y2="55" stroke="#f0abfc" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round" />
      <line x1="140" y1="15" x2="140" y2="75" stroke="#f0abfc" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round" />

      <g stroke="#1e1b4b" stroke-width="2.5">
        <rect x="82" y="54" width="36" height="34" rx="6" fill="url(#purpleGrad)" />
        <rect x="43" y="91" width="36" height="34" rx="6" fill="url(#purpleGrad)" />
        <rect x="82" y="91" width="36" height="34" rx="6" fill="url(#purpleGrad)" />
        <rect x="121" y="91" width="36" height="34" rx="6" fill="url(#purpleGrad)" />
      </g>

      <!-- Squished Monkey Face in center T block -->
      <g transform="translate(100, 108)">
        <circle cx="-13" cy="-2" r="5" fill="#78350f" stroke="#0f172a" stroke-width="1.5" />
        <circle cx="13" cy="-2" r="5" fill="#78350f" stroke="#0f172a" stroke-width="1.5" />
        <circle cx="0" cy="0" r="12" fill="#92400e" stroke="#0f172a" stroke-width="1.8" />
        <ellipse cx="0" cy="4" rx="9" ry="6" fill="#fde68a" />
        <circle cx="-4.5" cy="-3" r="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
        <circle cx="4.5" cy="-3" r="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
        <circle cx="-3.5" cy="-2" r="1.8" fill="#0f172a" />
        <circle cx="5.5" cy="-4" r="1.8" fill="#0f172a" />
        <ellipse cx="0" cy="5.5" rx="4.5" ry="3.2" fill="#991b1b" stroke="#0f172a" stroke-width="1.2" />
      </g>
    </g>
  </g>

  <!-- Big Mascot Monkey on the Left cheering -->
  <g transform="translate(115, 222)">
    <!-- Body -->
    <ellipse cx="0" cy="48" rx="42" ry="46" fill="#78350f" stroke="#0f172a" stroke-width="4" />
    <ellipse cx="0" cy="52" rx="26" ry="30" fill="#fde68a" />
    <!-- Ears -->
    <circle cx="-48" cy="-16" r="18" fill="#78350f" stroke="#0f172a" stroke-width="4" />
    <circle cx="-48" cy="-16" r="9" fill="#fca5a5" />
    <circle cx="48" cy="-16" r="18" fill="#78350f" stroke="#0f172a" stroke-width="4" />
    <circle cx="48" cy="-16" r="9" fill="#fca5a5" />
    <!-- Head -->
    <circle cx="0" cy="-14" r="44" fill="#92400e" stroke="#0f172a" stroke-width="4" />
    <!-- Tuft -->
    <path d="M-8 -56 Q0 -75 10 -56 Q18 -68 20 -52 Z" fill="#78350f" stroke="#0f172a" stroke-width="3" />
    <!-- Face mask -->
    <ellipse cx="0" cy="4" rx="34" ry="22" fill="#fde68a" />
    <ellipse cx="-14" cy="-16" rx="16" ry="15" fill="#fde68a" />
    <ellipse cx="14" cy="-16" rx="16" ry="15" fill="#fde68a" />
    <!-- Crazy Eyes -->
    <circle cx="-15" cy="-18" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="15" cy="-18" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="-12" cy="-16" r="5" fill="#0f172a" />
    <circle cx="12" cy="-21" r="5" fill="#0f172a" />
    <circle cx="-10" cy="-18" r="1.8" fill="#ffffff" />
    <circle cx="14" cy="-23" r="1.8" fill="#ffffff" />
    <!-- Nostrils -->
    <circle cx="-5" cy="-2" r="2.2" fill="#78350f" />
    <circle cx="5" cy="-2" r="2.2" fill="#78350f" />
    <!-- Huge Happy Grin -->
    <path d="M-20 8 Q0 30 20 8 Z" fill="#991b1b" stroke="#0f172a" stroke-width="2.8" />
    <rect x="-11" y="9" width="22" height="5" rx="2" fill="#ffffff" />
    <!-- Banana in hand -->
    <g transform="translate(52, 22) rotate(24)">
      <path d="M-6 -22 Q18 -6 4 24 Q2 10 -8 -16 Z" fill="#facc15" stroke="#0f172a" stroke-width="3" />
    </g>
  </g>

  <!-- Flying Bananas & Callout on Right -->
  <g transform="translate(465, 190)">
    <rect x="0" y="0" width="148" height="72" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#facc15" stroke-width="3" />
    <text x="74" y="28" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="18" font-weight="900">MACACTRIS!</text>
    <text x="74" y="48" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="800">+4 LIXO DE CASCA 🍌</text>
    <text x="74" y="64" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2P LOCAL • ONLINE P2P</text>
  </g>

  <!-- Floating Bananas -->
  <g transform="translate(515, 110) rotate(-28)">
    <path d="M-8 -24 Q20 -6 5 26 Q2 10 -10 -18 Z" fill="#fde047" stroke="#0f172a" stroke-width="3" />
  </g>
  <g transform="translate(565, 138) rotate(35)">
    <path d="M-6 -18 Q16 -4 4 20 Q1 8 -8 -13 Z" fill="#facc15" stroke="#0f172a" stroke-width="2.5" />
  </g>
  <g transform="translate(495, 305) rotate(15)">
    <path d="M-7 -20 Q18 -5 5 22 Q2 9 -9 -15 Z" fill="#fde047" stroke="#0f172a" stroke-width="2.5" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="180" height="66" rx="14" fill="#0f172a" fill-opacity="0.92" stroke="#facc15" stroke-width="3" />
    <text x="14" y="30" fill="#facc15" font-family="system-ui, sans-serif" font-size="22" font-weight="900">🍌 MACACTRIS</text>
    <text x="14" y="51" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="12" font-weight="800">EMPILHA BANANA!</text>
  </g>
</svg>
