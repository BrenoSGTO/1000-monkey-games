<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a9ae6" />
      <stop offset="60%" stop-color="#9bd6f7" />
      <stop offset="100%" stop-color="#fff1c4" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0c4a8a" />
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d5a2d" />
      <stop offset="100%" stop-color="#4a2e18" />
    </linearGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
    <g id="monkey">
      <path d="M-14 6 C-30 8 -34 -12 -22 -16" fill="none" stroke="#5b3a1a" stroke-width="5" stroke-linecap="round" />
      <ellipse cx="-5" cy="24" rx="7" ry="5" fill="#c9a070" />
      <ellipse cx="8" cy="24" rx="7" ry="5" fill="#c9a070" />
      <ellipse cx="0" cy="8" rx="15" ry="16" fill="#8b5a2b" />
      <ellipse cx="3" cy="11" rx="9" ry="11" fill="#f2d3a2" />
      <circle cx="-13" cy="-16" r="6" fill="#8b5a2b" /><circle cx="-13" cy="-16" r="3.4" fill="#f4a4a4" />
      <circle cx="16" cy="-16" r="6" fill="#5b3a1a" />
      <ellipse cx="2" cy="-14" rx="16" ry="15" fill="#8b5a2b" />
      <ellipse cx="6" cy="-9" rx="11" ry="9" fill="#f2d3a2" />
      <circle cx="-1" cy="-12" r="5" fill="#fff" /><circle cx="11" cy="-12" r="5" fill="#fff" />
      <circle cx="0" cy="-12" r="2.6" fill="#2a1a0e" /><circle cx="12" cy="-12" r="2.6" fill="#2a1a0e" />
      <path d="M-5 -19 L3 -16 M8 -16 L16 -19" stroke="#5b3a1a" stroke-width="2.6" stroke-linecap="round" />
      <path d="M3 -3 Q8 1 13 -3" fill="none" stroke="#2a1a0e" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="2" cy="-22" rx="19" ry="4" style="fill:var(--d)" />
      <path d="M-16 -22 A18 17 0 0 1 20 -22 Z" style="fill:var(--c);stroke:var(--d)" stroke-width="2" />
      <path d="M2 -39 L2 -23" stroke="#fff" stroke-opacity="0.6" stroke-width="3" />
      <circle cx="13" cy="-29" r="3" fill="#fde047" />
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)" />
  <circle cx="540" cy="62" r="42" fill="#fde047" opacity="0.9" />
  <g fill="#fff" opacity="0.85">
    <ellipse cx="120" cy="60" rx="52" ry="18" /><ellipse cx="156" cy="50" rx="34" ry="20" />
    <ellipse cx="360" cy="40" rx="44" ry="14" /><ellipse cx="392" cy="33" rx="28" ry="15" />
  </g>

  <rect y="270" width="640" height="90" fill="url(#sea)" />
  <path d="M0 272 Q40 262 80 272 T160 272 T240 272 T320 272 T400 272 T480 272 T560 272 T640 272" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="3" />

  <!-- ilha esquerda -->
  <path d="M-10 200 Q60 188 150 204 Q210 214 230 230 Q180 300 110 318 Q40 300 -10 270 Z" fill="url(#dirt)" />
  <path d="M-10 200 Q60 188 150 204 Q210 214 230 230 L226 238 Q200 222 150 214 Q60 198 -10 210 Z" fill="#4ade80" />
  <!-- ilha direita com cratera -->
  <path d="M390 214 Q460 196 560 206 Q650 214 660 226 L660 300 Q580 320 500 306 Q430 290 390 232 Z" fill="url(#dirt)" />
  <path d="M390 214 Q460 196 520 204 L540 214 Q590 222 640 212 L660 226 L660 232 Q590 232 540 224 L520 214 Q460 206 396 226 Z" fill="#4ade80" />
  <circle cx="530" cy="224" r="22" fill="#4a2e18" opacity="0.0" />

  <!-- macacos -->
  <g transform="translate(92 170) scale(0.95)" style="--c:#ef4444;--d:#991b1b"><use href="#monkey" /></g>
  <g transform="translate(590 178) scale(-0.95 0.95)" style="--c:#3b82f6;--d:#1e3a8a"><use href="#monkey" /></g>

  <!-- bazuca de coco -->
  <g transform="translate(118 176) rotate(-28)">
    <rect x="0" y="-5" width="46" height="10" rx="3" fill="#a3c46a" />
    <rect x="12" y="-6" width="3" height="12" fill="#6b8e3a" /><rect x="26" y="-6" width="3" height="12" fill="#6b8e3a" />
    <circle cx="48" cy="0" r="7" fill="#6b4423" />
  </g>

  <!-- trajetória e coco -->
  <path d="M168 150 Q300 20 420 160" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" />
  <g transform="translate(330 68) rotate(15)">
    <circle r="12" fill="#6b4423" /><circle cx="3" cy="-4" r="3" fill="#a3703a" />
    <circle cx="-3" cy="3" r="1.6" fill="#2a1a0e" /><circle cx="4" cy="4" r="1.6" fill="#2a1a0e" />
  </g>
  <g fill="#9ca3af" opacity="0.6"><circle cx="300" cy="82" r="6" /><circle cx="282" cy="94" r="8" /><circle cx="262" cy="108" r="10" /></g>

  <!-- explosão -->
  <circle cx="440" cy="178" r="52" fill="url(#boom)" />
  <g fill="#8d5a2d"><rect x="400" y="130" width="8" height="6" /><rect x="470" y="124" width="9" height="6" /><rect x="486" y="150" width="6" height="5" /></g>
  <text x="458" y="124" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="30" fill="#fb7185" stroke="#000" stroke-width="1.5" paint-order="stroke">-45</text>

  <!-- pombos -->
  <g fill="#94a3b8"><ellipse cx="520" cy="46" rx="14" ry="7" /><ellipse cx="560" cy="62" rx="12" ry="6" /></g>
  <g fill="#6b3f1d"><circle cx="520" cy="68" r="5" /><circle cx="560" cy="82" r="5" /></g>

  <!-- título -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="338" font-size="40" fill="#b45309" stroke="#b45309" stroke-width="6" stroke-linejoin="round">MACACOS EM GUERRA</text>
    <text x="320" y="334" font-size="40" fill="#fde047" stroke="#7c2d12" stroke-width="2" paint-order="stroke">MACACOS EM GUERRA</text>
  </g>
</svg>
