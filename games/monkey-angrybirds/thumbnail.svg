<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="65%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <radialGradient id="furHero" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="55%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="furSagui" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>
    <radialGradient id="pigGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="65%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </radialGradient>
    <linearGradient id="maskCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sky & Clouds -->
  <rect width="640" height="360" fill="url(#sky)" />
  <circle cx="520" cy="68" r="40" fill="#fde047" opacity="0.9" />
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="68" rx="48" ry="20" />
    <ellipse cx="170" cy="60" rx="34" ry="22" />
    <ellipse cx="360" cy="52" rx="44" ry="18" />
    <ellipse cx="395" cy="46" rx="28" ry="18" />
  </g>

  <!-- Distant Jungle Hills -->
  <path d="M0 260 Q140 190 290 250 T640 230 L640 360 L0 360 Z" fill="#22c55e" opacity="0.55" />
  <path d="M0 290 Q190 235 370 285 T640 275 L640 360 L0 360 Z" fill="url(#hills)" />
  <rect x="0" y="308" width="640" height="52" fill="#65a30d" />
  <rect x="0" y="316" width="640" height="44" fill="#78350f" />

  <!-- Trajectory Dots -->
  <g fill="#ffffff" stroke="#1e293b" stroke-width="2">
    <circle cx="152" cy="186" r="5" />
    <circle cx="185" cy="152" r="4.8" />
    <circle cx="222" cy="128" r="4.5" />
    <circle cx="262" cy="116" r="4.2" />
    <circle cx="304" cy="116" r="3.8" />
    <circle cx="345" cy="128" r="3.4" />
  </g>

  <!-- Waiting Sagui Monkey behind slingshot -->
  <g transform="translate(36, 286)" filter="url(#drop)">
    <path d="M-12 6 C-26 8, -28 -10, -18 -14" fill="none" stroke="#1e1b18" stroke-width="7" stroke-linecap="round" />
    <path d="M-12 6 C-26 8, -28 -10, -18 -14" fill="none" stroke="#075985" stroke-width="4" stroke-linecap="round" />
    <circle cx="-18" cy="-4" r="7" fill="#0284c7" stroke="#1e1b18" stroke-width="2.5" />
    <circle cx="-18" cy="-4" r="3.8" fill="#f9a8d4" />
    <circle cx="18" cy="-4" r="7" fill="#0284c7" stroke="#1e1b18" stroke-width="2.5" />
    <circle cx="18" cy="-4" r="3.8" fill="#f9a8d4" />
    <path d="M-6 -18 L-2 -29 L2 -22 L6 -30 L9 -18 Z" fill="#38bdf8" stroke="#1e1b18" stroke-width="2.2" />
    <circle cx="0" cy="0" r="19" fill="url(#furSagui)" stroke="#1e1b18" stroke-width="3" />
    <path d="M0 -6 C6 -13, 15 -6, 13 2 C15 10, 8 15, 0 14 C-8 15, -15 10, -13 2 C-15 -6, -6 -13, 0 -6 Z" fill="url(#maskCream)" />
    <circle cx="-6" cy="-2" r="4.8" fill="#fff" stroke="#1e1b18" stroke-width="1.6" />
    <circle cx="6" cy="-2" r="4.8" fill="#fff" stroke="#1e1b18" stroke-width="1.6" />
    <circle cx="-4.5" cy="-2" r="2" fill="#0f172a" />
    <circle cx="4.5" cy="-2" r="2" fill="#0f172a" />
    <circle cx="-5.5" cy="-3.2" r="0.9" fill="#fff" />
    <circle cx="3.5" cy="-3.2" r="0.9" fill="#fff" />
    <path d="M-5 7 Q0 12 5 7" fill="none" stroke="#1e1b18" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Vine Slingshot (Back Fork & Elastic) -->
  <path d="M126 236 L142 192" stroke="#713f12" stroke-width="9" stroke-linecap="round" />
  <line x1="142" y1="192" x2="78" y2="232" stroke="#4d2c0a" stroke-width="6" stroke-linecap="round" />

  <!-- Castle of Wood, Glass & TNT -->
  <g transform="translate(388, 128)">
    <rect x="10" y="90" width="22" height="90" rx="3" fill="url(#wood)" stroke="#451a03" stroke-width="3" />
    <rect x="148" y="90" width="22" height="90" rx="3" fill="url(#wood)" stroke="#451a03" stroke-width="3" />
    <rect x="0" y="70" width="180" height="22" rx="4" fill="url(#wood)" stroke="#451a03" stroke-width="3" />
    <rect x="28" y="14" width="18" height="56" rx="3" fill="#7dd3fc" fill-opacity="0.72" stroke="#0284c7" stroke-width="3" />
    <rect x="134" y="14" width="18" height="56" rx="3" fill="#7dd3fc" fill-opacity="0.72" stroke="#0284c7" stroke-width="3" />
    <rect x="18" y="-6" width="144" height="20" rx="4" fill="url(#wood)" stroke="#451a03" stroke-width="3" />
    <rect x="70" y="128" width="40" height="50" rx="5" fill="#dc2626" stroke="#7f1d1d" stroke-width="3" />
    <rect x="70" y="142" width="40" height="22" fill="#fef08a" />
    <text x="90" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#991b1b">TNT</text>

    <!-- Scared Faria Limer Vest Pig inside castle -->
    <g transform="translate(90, 44)">
      <circle cx="-17" cy="-17" r="6.5" fill="#84cc16" stroke="#365314" stroke-width="2.5" />
      <circle cx="-17" cy="-17" r="3" fill="#bef264" />
      <circle cx="17" cy="-17" r="6.5" fill="#84cc16" stroke="#365314" stroke-width="2.5" />
      <circle cx="17" cy="-17" r="3" fill="#bef264" />
      <circle cx="0" cy="0" r="22" fill="url(#pigGrad)" stroke="#365314" stroke-width="3" />
      <path d="M-19 7 Q0 24 19 7 L15 21 Q0 27 -15 21 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <circle cx="-9" cy="-4" r="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <circle cx="9" cy="-4" r="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <circle cx="-10" cy="-4" r="2.2" fill="#0f172a" />
      <circle cx="8" cy="-4" r="2.2" fill="#0f172a" />
      <circle cx="-11" cy="-5.2" r="1" fill="#fff" />
      <circle cx="7" cy="-5.2" r="1" fill="#fff" />
      <ellipse cx="0" cy="4" rx="7" ry="5" fill="#bef264" stroke="#365314" stroke-width="2" />
      <circle cx="-2.5" cy="4" r="1.3" fill="#365314" />
      <circle cx="2.5" cy="4" r="1.3" fill="#365314" />
      <ellipse cx="0" cy="13" rx="5" ry="4" fill="#7f1d1d" />
    </g>
  </g>

  <!-- Explosion Sparks on Castle Corner -->
  <g transform="translate(362, 130)">
    <polygon points="0,-24 7,-8 24,-10 11,3 20,20 3,12 -10,24 -9,7 -25,0 -9,-8" fill="#f97316" stroke="#fef08a" stroke-width="2" />
  </g>

  <!-- Furious Hero Monkey Loaded in Slingshot -->
  <g transform="translate(82, 222) rotate(-18)" filter="url(#drop)">
    <!-- Tail -->
    <path d="M-18 10 C-38 14, -44 -10, -30 -16" fill="none" stroke="#1e1b18" stroke-width="10" stroke-linecap="round" />
    <path d="M-18 10 C-38 14, -44 -10, -30 -16" fill="none" stroke="#78350f" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="-30" cy="-16" r="3" fill="#fcd34d" />
    <!-- Trailing bandana ribbons -->
    <polygon points="-24,-12 -42,-20 -36,-7" fill="#dc2626" stroke="#1e1b18" stroke-width="2.2" />
    <!-- Ears with pink inner -->
    <circle cx="-27" cy="-4" r="11" fill="#b45309" stroke="#1e1b18" stroke-width="3" />
    <circle cx="-27" cy="-4" r="6" fill="#fda4af" />
    <circle cx="27" cy="-4" r="11" fill="#b45309" stroke="#1e1b18" stroke-width="3" />
    <circle cx="27" cy="-4" r="6" fill="#fda4af" />
    <!-- Hair tuft -->
    <path d="M-8 -25 L-3 -38 L2 -29 L7 -40 L10 -25 Z" fill="#b45309" stroke="#1e1b18" stroke-width="2.5" />
    <!-- Head -->
    <circle cx="0" cy="0" r="27" fill="url(#furHero)" stroke="#1e1b18" stroke-width="3.2" />
    <!-- Tucked paws -->
    <ellipse cx="-13" cy="24" rx="6.5" ry="4.2" fill="#fcd34d" stroke="#1e1b18" stroke-width="2.4" />
    <ellipse cx="13" cy="24" rx="6.5" ry="4.2" fill="#fcd34d" stroke="#1e1b18" stroke-width="2.4" />
    <!-- Heart/Peanut face mask -->
    <path d="M0 -8 C10 -19, 24 -8, 19 3 C24 14, 12 22, 0 20 C-12 22, -24 14, -19 3 C-24 -8, -10 -19, 0 -8 Z" fill="url(#maskCream)" stroke="#78350f" stroke-width="1.5" />
    <!-- Red headband -->
    <rect x="-25" y="-16" width="50" height="7.5" rx="3" fill="#dc2626" stroke="#1e1b18" stroke-width="2.4" />
    <!-- Googly angry eyes + white highlights -->
    <circle cx="-9" cy="-2" r="7" fill="#ffffff" stroke="#1e1b18" stroke-width="2.2" />
    <circle cx="9" cy="-2" r="7" fill="#ffffff" stroke="#1e1b18" stroke-width="2.2" />
    <circle cx="-6.8" cy="-1.5" r="2.9" fill="#0f172a" />
    <circle cx="11.2" cy="-2.5" r="2.9" fill="#0f172a" />
    <circle cx="-8.2" cy="-3.2" r="1.2" fill="#ffffff" />
    <circle cx="9.8" cy="-4.2" r="1.2" fill="#ffffff" />
    <!-- Angry eyebrows -->
    <path d="M-18 -11 L-2 -6 M18 -11 L2 -6" stroke="#1e1b18" stroke-width="4.2" stroke-linecap="round" />
    <!-- Nostrils -->
    <circle cx="-2.5" cy="5" r="1.3" fill="#78350f" />
    <circle cx="2.5" cy="5" r="1.3" fill="#78350f" />
    <!-- Battle-cry grin with fangs -->
    <ellipse cx="0" cy="13" rx="9.5" ry="6.5" fill="#7f1d1d" stroke="#1e1b18" stroke-width="2" />
    <ellipse cx="0" cy="16.5" rx="5.5" ry="2.5" fill="#fb7185" />
    <polygon points="-6,8 -3.5,12.5 -1,8" fill="#ffffff" />
    <polygon points="1,8 3.5,12.5 6,8" fill="#ffffff" />
  </g>

  <!-- Vine Slingshot Front Stem & Elastic -->
  <line x1="78" y1="232" x2="108" y2="196" stroke="#65a30d" stroke-width="6" stroke-linecap="round" />
  <path d="M124 316 L124 238 L108 196" fill="none" stroke="#854d0e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M124 316 L124 238 L108 196" fill="none" stroke="#a16207" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Vine leaves on slingshot -->
  <ellipse cx="132" cy="276" rx="10" ry="5" transform="rotate(-25 132 276)" fill="#22c55e" stroke="#14532d" stroke-width="2" />
  <ellipse cx="114" cy="258" rx="9" ry="4.5" transform="rotate(28 114 258)" fill="#4ade80" stroke="#14532d" stroke-width="2" />

  <!-- Title Badge -->
  <g transform="translate(24, 20)" filter="url(#drop)">
    <rect x="0" y="0" width="286" height="48" rx="14" fill="#111827" fill-opacity="0.9" stroke="#facc15" stroke-width="3" />
    <text x="16" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#fde047">🎯 MACACOS PISTOLA</text>
  </g>
</svg>
