<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="arenaBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#133a2a"/>
      <stop offset="65%" stop-color="#0b2219"/>
      <stop offset="100%" stop-color="#05110c"/>
    </radialGradient>
    <radialGradient id="bigMonkeyGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="smallMonkeyGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="cactusGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="70%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-opacity="0.14" stroke-width="1.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background & Arena Grid -->
  <rect width="640" height="360" fill="url(#arenaBg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Scattered Bananas -->
  <g transform="translate(88 92) rotate(-25)">
    <path d="M-14 4 C-6 -12, 10 -12, 16 2 C6 -3, -4 -2, -14 4 Z" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
  </g>
  <g transform="translate(310 296) rotate(18)">
    <path d="M-14 4 C-6 -12, 10 -12, 16 2 C6 -3, -4 -2, -14 4 Z" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
  </g>
  <g transform="translate(568 112) rotate(32)">
    <path d="M-16 5 C-8 -14, 12 -14, 18 3 C8 -4, -4 -2, -16 5 Z" fill="#fde047" stroke="#854d0e" stroke-width="2"/>
  </g>
  <g transform="translate(132 308) rotate(10)">
    <path d="M-12 3 C-5 -10, 8 -10, 14 2 C5 -2, -3 -1, -12 3 Z" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
  </g>

  <!-- Spiky Cactus Virus -->
  <g transform="translate(532 268)" filter="url(#shadow)">
    <polygon points="0,-46 11,-28 28,-38 25,-18 45,-14 30,2 44,20 24,22 28,42 10,30 0,48 -10,30 -28,42 -24,22 -44,20 -30,2 -45,-14 -25,-18 -28,-38 -11,-28" fill="url(#cactusGrad)" stroke="#1a2e05" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-10" cy="-4" r="7" fill="#fff" stroke="#1a2e05" stroke-width="2"/>
    <circle cx="-8" cy="-4" r="3" fill="#1a2e05"/>
    <circle cx="10" cy="-4" r="7" fill="#fff" stroke="#1a2e05" stroke-width="2"/>
    <circle cx="12" cy="-4" r="3" fill="#1a2e05"/>
    <path d="M-12 12 Q0 4 12 12" fill="none" stroke="#1a2e05" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Giant Hunter Monkey Blob ("MACACO DO PIX") -->
  <g transform="translate(205 202)" filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="-84" cy="-58" r="28" fill="#ca8a04" stroke="#422006" stroke-width="5"/>
    <circle cx="-84" cy="-58" r="15" fill="#fed7aa"/>
    <circle cx="84" cy="-58" r="28" fill="#ca8a04" stroke="#422006" stroke-width="5"/>
    <circle cx="84" cy="-58" r="15" fill="#fed7aa"/>

    <!-- Wobbly Blob Body -->
    <path d="M 0 -106 C 60 -108, 108 -62, 106 0 C 108 62, 60 108, 0 106 C -60 108, -108 62, -106 0 C -108 -62, -60 -108, 0 -106 Z" fill="url(#bigMonkeyGrad)" stroke="#422006" stroke-width="6"/>

    <!-- Face Mask -->
    <ellipse cx="-24" cy="-18" rx="34" ry="30" fill="#fed7aa"/>
    <ellipse cx="24" cy="-18" rx="34" ry="30" fill="#fed7aa"/>
    <ellipse cx="0" cy="24" rx="56" ry="42" fill="#fed7aa"/>

    <!-- Crown -->
    <polygon points="-34,-100 -42,-134 -14,-114 0,-142 14,-114 42,-134 34,-100" fill="#fbbf24" stroke="#422006" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="-118" r="5" fill="#ef4444"/>

    <!-- Hungry Eyes looking right -->
    <circle cx="-22" cy="-22" r="16" fill="#ffffff" stroke="#422006" stroke-width="3.5"/>
    <circle cx="-15" cy="-22" r="7.5" fill="#111827"/>
    <circle cx="-12" cy="-25" r="2.5" fill="#ffffff"/>

    <circle cx="22" cy="-22" r="16" fill="#ffffff" stroke="#422006" stroke-width="3.5"/>
    <circle cx="29" cy="-22" r="7.5" fill="#111827"/>
    <circle cx="32" cy="-25" r="2.5" fill="#ffffff"/>

    <!-- Mischievous eyebrows -->
    <line x1="-38" y1="-42" x2="-10" y2="-34" stroke="#422006" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="-42" x2="10" y2="-34" stroke="#422006" stroke-width="5" stroke-linecap="round"/>

    <!-- Nostrils -->
    <circle cx="-8" cy="2" r="3.5" fill="#78350f"/>
    <circle cx="8" cy="2" r="3.5" fill="#78350f"/>

    <!-- Wide Open Hungry Mouth -->
    <path d="M-36 18 Q0 8 36 18 Q34 58 0 58 Q-34 58 -36 18 Z" fill="#7f1d1d" stroke="#422006" stroke-width="4"/>
    <ellipse cx="0" cy="48" rx="20" ry="9" fill="#fb7185"/>
    <path d="M-24 18 L-18 28 L-12 18 M12 18 L18 28 L24 18" fill="#ffffff" stroke="#422006" stroke-width="2"/>
  </g>

  <!-- Scared Small Monkey Blob ("TIO DO ZAP") -->
  <g transform="translate(432 192)" filter="url(#shadow)">
    <!-- Motion lines -->
    <line x1="-68" y1="-16" x2="-48" y2="-16" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-74" y1="6" x2="-52" y2="6" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Ears -->
    <circle cx="-36" cy="-24" r="13" fill="#0891b2" stroke="#083344" stroke-width="3.5"/>
    <circle cx="-36" cy="-24" r="7" fill="#fed7aa"/>
    <circle cx="36" cy="-24" r="13" fill="#0891b2" stroke="#083344" stroke-width="3.5"/>
    <circle cx="36" cy="-24" r="7" fill="#fed7aa"/>

    <!-- Blob -->
    <circle cx="0" cy="0" r="44" fill="url(#smallMonkeyGrad)" stroke="#083344" stroke-width="4.5"/>

    <!-- Face -->
    <ellipse cx="-11" cy="-7" rx="15" ry="13" fill="#fed7aa"/>
    <ellipse cx="11" cy="-7" rx="15" ry="13" fill="#fed7aa"/>
    <ellipse cx="0" cy="12" rx="24" ry="18" fill="#fed7aa"/>

    <!-- Wide Panicked Eyes looking back -->
    <circle cx="-11" cy="-8" r="9.5" fill="#ffffff" stroke="#083344" stroke-width="2.5"/>
    <circle cx="-15" cy="-8" r="3" fill="#111827"/>
    <circle cx="11" cy="-8" r="9.5" fill="#ffffff" stroke="#083344" stroke-width="2.5"/>
    <circle cx="7" cy="-8" r="3" fill="#111827"/>

    <!-- Sweat drop -->
    <path d="M28 -26 Q35 -16 30 -10 Q25 -10 28 -26 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Screaming O mouth -->
    <ellipse cx="0" cy="14" rx="10" ry="12" fill="#7f1d1d" stroke="#083344" stroke-width="3"/>
  </g>

  <!-- Speech Bubble -->
  <g transform="translate(465 118)">
    <rect x="-66" y="-20" width="132" height="32" rx="16" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff">SOCORROOO!!</text>
  </g>

  <!-- Title Banner -->
  <g transform="translate(320 44)">
    <rect x="-220" y="-28" width="440" height="54" rx="18" fill="#052e16" fill-opacity="0.9" stroke="#facc15" stroke-width="3.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="27" fill="#facc15" letter-spacing="1">AGAR.MICO</text>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#bbf7d0" letter-spacing="2">MACACO COME MACACO</text>
  </g>
</svg>
