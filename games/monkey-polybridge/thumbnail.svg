<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="62%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="18%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Sky & Sun -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="545" cy="70" r="42" fill="#fde047" opacity="0.9"/>
  <circle cx="545" cy="70" r="54" fill="#fde047" opacity="0.25"/>
  <ellipse cx="140" cy="65" rx="48" ry="18" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="170" cy="58" rx="34" ry="15" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="380" cy="50" rx="52" ry="16" fill="#ffffff" opacity="0.7"/>

  <!-- Distant Jungle Hills -->
  <path d="M0 245 Q120 185 260 245 T520 235 L640 245 L640 360 L0 360 Z" fill="#15803d" opacity="0.45"/>

  <!-- River -->
  <rect x="0" y="255" width="640" height="105" fill="url(#water)"/>
  <path d="M120 278 Q160 270 200 278 T280 278 T360 278 T440 278 T520 278" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M150 308 Q190 300 230 308 T310 308 T390 308 T470 308" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Laughing Crocodiles -->
  <g transform="translate(235, 290)">
    <ellipse cx="0" cy="8" rx="44" ry="14" fill="#166534"/>
    <path d="M-32 4 L-12 -10 L10 4 Z" fill="#15803d"/>
    <circle cx="-10" cy="-4" r="5" fill="#fef08a"/>
    <circle cx="-9" cy="-4" r="2.2" fill="#111827"/>
    <!-- Open jaws -->
    <path d="M10 4 L48 -14 L42 6 Z" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
    <path d="M12 8 L46 16 L36 6 Z" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    <path d="M22 0 L26 4 L30 -3 M34 -6 L37 -1 L41 -8" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="20" y="-20" font-family="system-ui,sans-serif" font-size="13" font-weight="900" fill="#fef08a" stroke="#0f172a" stroke-width="3" paint-order="stroke">HAHAHA!</text>
  </g>
  <g transform="translate(425, 314) scale(-0.85, 0.85)">
    <ellipse cx="0" cy="8" rx="42" ry="13" fill="#166534"/>
    <circle cx="-10" cy="-4" r="5" fill="#fef08a"/>
    <circle cx="-9" cy="-4" r="2" fill="#111827"/>
    <path d="M10 4 L45 -10 L40 8 Z" fill="#22c55e"/>
  </g>

  <!-- Left & Right Cliffs -->
  <path d="M0 198 L148 198 L166 250 L152 360 L0 360 Z" fill="url(#cliff)"/>
  <path d="M492 198 L640 198 L640 360 L488 360 L472 250 Z" fill="url(#cliff)"/>
  <rect x="0" y="192" width="150" height="10" rx="3" fill="#65a30d"/>
  <rect x="490" y="192" width="150" height="10" rx="3" fill="#65a30d"/>

  <!-- Sagging & Snapping Bamboo/Vine Bridge -->
  <!-- High vine cables -->
  <path d="M148 145 Q280 205 335 190" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <path d="M492 145 Q420 205 365 215" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <!-- Left & Right Wooden Towers -->
  <rect x="136" y="138" width="14" height="60" rx="3" fill="#92400e" stroke="#451a03" stroke-width="2"/>
  <rect x="490" y="138" width="14" height="60" rx="3" fill="#92400e" stroke="#451a03" stroke-width="2"/>

  <!-- Bamboo Truss & Deck (left intact, middle snapping red!) -->
  <g stroke-linecap="round">
    <!-- Left intact bamboo triangles -->
    <line x1="148" y1="198" x2="225" y2="150" stroke="#84cc16" stroke-width="6"/>
    <line x1="225" y1="150" x2="245" y2="212" stroke="#eab308" stroke-width="6"/>
    <line x1="225" y1="150" x2="315" y2="178" stroke="#f97316" stroke-width="6"/>
    <!-- Snapping red beam in center! -->
    <line x1="245" y1="212" x2="312" y2="232" stroke="#ef4444" stroke-width="8"/>
    <line x1="336" y1="238" x2="405" y2="216" stroke="#ef4444" stroke-width="8"/>
    <!-- Right side -->
    <line x1="405" y1="216" x2="492" y2="198" stroke="#eab308" stroke-width="7"/>
    <line x1="405" y1="216" x2="435" y2="165" stroke="#84cc16" stroke-width="6"/>
    <line x1="435" y1="165" x2="492" y2="198" stroke="#84cc16" stroke-width="6"/>
    <!-- Road Planks -->
    <line x1="148" y1="198" x2="245" y2="212" stroke="#c2854c" stroke-width="10"/>
    <line x1="245" y1="212" x2="312" y2="232" stroke="#dc2626" stroke-width="10"/>
    <line x1="336" y1="238" x2="405" y2="216" stroke="#c2854c" stroke-width="10"/>
    <line x1="405" y1="216" x2="492" y2="198" stroke="#c2854c" stroke-width="10"/>
  </g>

  <!-- Snap Explosion Spark -->
  <polygon points="324,218 332,230 346,225 335,237 344,250 328,243 317,255 319,240 306,236 320,231" fill="#fde047" stroke="#ef4444" stroke-width="2.5"/>
  <text x="325" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="900" fill="#ef4444" stroke="#fff" stroke-width="4" paint-order="stroke">CREC!</text>

  <!-- Bridge Nodes -->
  <g fill="#facc15" stroke="#451a03" stroke-width="2.5">
    <circle cx="148" cy="198" r="6"/>
    <circle cx="245" cy="212" r="5"/>
    <circle cx="225" cy="150" r="5"/>
    <circle cx="405" cy="216" r="5"/>
    <circle cx="435" cy="165" r="5"/>
    <circle cx="492" cy="198" r="6"/>
  </g>

  <!-- Tilted Monkey Kombi Bus! -->
  <g transform="translate(278, 178) rotate(22)">
    <!-- Body -->
    <rect x="-46" y="-26" width="92" height="44" rx="10" fill="#facc15" stroke="#78350f" stroke-width="3"/>
    <rect x="-46" y="-6" width="92" height="12" fill="#f97316"/>
    <!-- Windows with screaming monkeys -->
    <rect x="-36" y="-20" width="20" height="14" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
    <rect x="-11" y="-20" width="20" height="14" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
    <rect x="14" y="-20" width="22" height="14" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
    <!-- Monkey heads in windows -->
    <circle cx="-26" cy="-12" r="6" fill="#92400e"/>
    <circle cx="-26" cy="-11" r="4" fill="#fde68a"/>
    <circle cx="-1" cy="-12" r="6" fill="#92400e"/>
    <circle cx="-1" cy="-11" r="4" fill="#fde68a"/>
    <circle cx="25" cy="-12" r="6" fill="#92400e"/>
    <circle cx="25" cy="-11" r="4" fill="#fde68a"/>
    <!-- Wheels -->
    <circle cx="-26" cy="20" r="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="-26" cy="20" r="4" fill="#cbd5e1"/>
    <circle cx="26" cy="20" r="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="26" cy="20" r="4" fill="#cbd5e1"/>
  </g>

  <!-- Flying Ragdoll Monkey & Banana -->
  <g transform="translate(362, 118) rotate(-32)">
    <line x1="0" y1="0" x2="-12" y2="18" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="-16" y2="-6" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="15" y2="-8" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="10" fill="#78350f"/>
    <circle cx="0" cy="-4" r="7" fill="#fde68a"/>
    <circle cx="-3" cy="-6" r="2.2" fill="#fff"/>
    <circle cx="3" cy="-6" r="2.2" fill="#fff"/>
    <circle cx="-3.5" cy="-6" r="1" fill="#000"/>
    <circle cx="3.5" cy="-6" r="1" fill="#000"/>
    <ellipse cx="0" cy="0" rx="3" ry="3.5" fill="#7f1d1d"/>
  </g>
  <text x="398" y="96" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#fff" stroke="#7f1d1d" stroke-width="4" paint-order="stroke">SOCORROOO!</text>

  <!-- Title Badge -->
  <g transform="translate(320, 44)">
    <rect x="-220" y="-28" width="440" height="46" rx="14" fill="#0f172a" opacity="0.84" stroke="#facc15" stroke-width="3"/>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#fde047" letter-spacing="0.5">🌉 PONTE DE CIPÓ &amp; GAMBIARRA</text>
  </g>
</svg>
